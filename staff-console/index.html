<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StrongMind Staff Console — clickable prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF7F1;
  --card:#FFFFFF;
  --ink:#22201E;
  --ink-2:#4A4643;
  --muted:#7C756D;
  --line:#E8E1D7;
  --line-soft:#F1EBE2;
  --purple:#6D4AA7;
  --purple-ink:#513480;
  --purple-soft:#F2EDF9;
  --teal:#1E7D8C;
  --coral:#D9583A;
  --amber:#EFAF23;
  --green:#2C7A57;
  --green-soft:#EAF3EE;
  --red-soft:#FBECE8;
  --rail:#241F1C;
  --rail-2:#332C27;
  --rail-text:#EDE6DC;
  --rail-muted:#A39A90;
  --gap:#A25E13;
  --gap-soft:#FBF0DF;
  --slate:#2E3440;
  --field:#F1EFF6;
  --field-line:#E2DEEC;
  --r-card:14px;
  --r-pill:999px;
  --shadow:0 1px 2px rgba(34,32,30,.05), 0 8px 24px -16px rgba(34,32,30,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:Outfit,-apple-system,Segoe UI,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.mono,code{font-family:"IBM Plex Mono",ui-monospace,monospace}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--purple);text-decoration:none}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============ sign-in ============ */
.signin{min-height:100vh;background:var(--paper);display:flex;justify-content:center;padding:0 24px}
.signin-col{width:100%;max-width:452px;padding:64px 0 48px;text-align:center}
.logo-stack{display:grid;justify-items:center;gap:6px;margin-bottom:26px}
.logo-stack svg{width:38px;height:38px}
.wordmark{font-size:29px;font-weight:700;letter-spacing:-.03em;line-height:1}
.wordmark .s{color:var(--purple)}
.wordmark .m{color:#F0A81F}
.wordmark sup{font-size:9px;font-weight:500;color:var(--muted);vertical-align:super;margin-left:1px}
.signin-card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:34px 30px 30px}
.signin h1{font-size:30px;font-weight:700;color:var(--ink);letter-spacing:-.03em;margin:0 0 26px}
.pill-field{position:relative;margin-bottom:9px}
.signin .pill-field input{
  width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-pill);
  padding:15px 20px 15px 48px;font-size:15px;color:var(--ink);transition:border-color .12s,background .12s;
}
.signin .pill-field input::placeholder{color:#9E958B}
.signin .pill-field input:focus{outline:none;border-color:var(--purple);background:var(--card)}
.pill-field .fi{position:absolute;left:19px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.mini-link{display:block;text-align:right;font-size:13px;color:var(--purple);margin:0 6px 20px 0}
.mini-link:hover{text-decoration:underline}
.row-between{display:flex;align-items:center;justify-content:space-between;margin:14px 6px 24px}
.remember{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink-2)}
.remember .box{width:17px;height:17px;border:1.5px solid #CFC5B7;border-radius:5px;background:var(--card);display:grid;place-items:center}
.remember .box svg{width:11px;height:11px;opacity:0;color:#fff}
.remember[aria-pressed=true] .box{background:var(--purple);border-color:var(--purple)}
.remember[aria-pressed=true] .box svg{opacity:1}
.pill-btn{width:100%;border-radius:var(--r-pill);padding:14px 20px;font-size:15px;font-weight:600;transition:filter .12s,background .12s}
.pill-btn-primary{background:var(--purple);color:#fff;margin-bottom:11px}
.pill-btn-primary:hover{filter:brightness(1.08)}
.pill-btn-secondary{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.pill-btn-secondary:hover{background:var(--line-soft)}
.or{font-size:13px;font-weight:500;color:var(--muted);margin:24px 0 12px}
.bolt-door{
  position:relative;width:54px;height:54px;border-radius:50%;display:inline-grid;place-items:center;
  transition:background .14s;border:1.5px solid transparent
}
.bolt-door:hover{background:var(--paper);border-color:var(--line)}
.bolt-door svg{width:28px;height:28px}
.bolt-door .tip{
  position:absolute;top:-34px;left:50%;transform:translateX(-50%);white-space:nowrap;
  background:var(--ink);color:#fff;font-size:12px;padding:5px 10px;border-radius:7px;
  opacity:0;pointer-events:none;transition:opacity .12s
}
.bolt-door:hover .tip,.bolt-door:focus-visible .tip{opacity:1}
.signin-foot{font-size:12.5px;color:var(--muted);margin-top:26px}
.signin-foot a{color:var(--muted);text-decoration:underline}
.hint-msg{font-size:13px;color:var(--gap);background:var(--gap-soft);border:1px solid #EBD6AE;border-radius:10px;padding:11px 14px;margin-bottom:18px;text-align:left}
.path{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink-2);margin-bottom:18px;overflow-x:auto;white-space:nowrap}
.disclose{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--paper)}
.disclose ul{margin:8px 0 0;padding-left:20px;font-size:13.5px;color:var(--ink-2)}
.disclose li{margin-bottom:5px}

/* ============ shell ============ */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.rail{background:var(--rail);color:var(--rail-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.rail-top{padding:20px 18px 14px}
.mark{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.02em;color:var(--rail-text)}
.mark svg{width:24px;height:24px;flex:none}
.staff-tag{display:inline-block;margin-top:12px;font-size:10.5px;font-weight:600;letter-spacing:.11em;color:#F0C87A;border:1px solid #5B4A2E;background:#3A2F1D;border-radius:5px;padding:3px 7px}
nav{padding:16px 10px;flex:1;overflow-y:auto;border-top:1px solid var(--rail-2)}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:9px;color:#D8D0C6;font-size:14px;transition:background .12s,color .12s}
.nav-item:hover{background:var(--rail-2);color:#fff}
.nav-item[aria-current=page]{background:#3D342D;color:#fff;font-weight:600}
.nav-item svg{width:17px;height:17px;flex:none;opacity:.85}
.nav-item .count{margin-left:auto;font-size:11.5px;font-family:"IBM Plex Mono",monospace;background:#4A3F36;color:#E4DACB;border-radius:5px;padding:1px 6px}
.nav-item .count.hot{background:#5C2E1E;color:#FFC7B2}
.rail-foot{border-top:1px solid var(--rail-2);padding:14px;display:grid;gap:12px}
.who-row{display:flex;gap:11px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13.5px;flex:none}
.who-row .nm{font-weight:600;font-size:14px;line-height:1.2}
.who-row .rl{font-size:11.5px;color:var(--rail-muted)}
.signout{margin-left:auto;font-size:12.5px;color:#BFB5A9;border:1px solid var(--rail-2);border-radius:8px;padding:5px 10px}
.signout:hover{background:var(--rail-2);color:#fff}
.toggle{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#CFC6BB;padding:4px;width:100%;text-align:left}
.sw{width:34px;height:19px;border-radius:999px;background:#4A4038;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2.5px;left:2.5px;width:14px;height:14px;border-radius:50%;background:#B9AFA3;transition:transform .15s,background .15s}
.toggle[aria-pressed=true] .sw{background:#8A5A18}
.toggle[aria-pressed=true] .sw::after{transform:translateX(15px);background:#FFD79A}

main{min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:14px 30px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
.crumb{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--muted);min-width:0}
.crumb a,.crumb button{color:var(--purple);font-weight:500}
.crumb .sep{color:#C9BFB1}
.crumb .now{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.back:hover{background:var(--line-soft)}
.env{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--gap);background:var(--gap-soft);border:1px solid #EBD6AE;border-radius:6px;padding:4px 8px;flex:none}
.page{padding:26px 30px 70px;max-width:1180px;width:100%}
.page-head{margin-bottom:20px}
.page-head h1{font-size:29px;letter-spacing:-.025em;margin:0 0 5px}
.page-head p{color:var(--muted);margin:0;max-width:64ch}

/* ============ primitives ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.card-head{padding:15px 20px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card-head h2{font-size:16px;margin:0;letter-spacing:-.01em}
.card-head .hint{font-size:12.5px;color:var(--muted)}
.card-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:grid;gap:16px}
@media(max-width:1050px){.split{grid-template-columns:1fr}}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.07em;color:#8A8177;background:var(--paper);padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line-soft);vertical-align:middle;font-size:14px}
tbody tr:last-child td{border-bottom:0}
tr.row:hover{background:#FCFAF6;cursor:pointer}
.rowlink{font-weight:600;color:var(--ink);display:inline-block}
.rowlink:hover{color:var(--purple);text-decoration:underline}
.t-sub{font-size:12.5px;color:var(--muted)}
.num{font-family:"IBM Plex Mono",monospace;font-size:13px}
.em{font-weight:600}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-pill);padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill .bud{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill-active{background:var(--green-soft);color:#1F6244}
.pill-off{background:var(--red-soft);color:#A63B21}
.pill-paused{background:#FDF3DC;color:#8A5A0B}
.pill-trial{background:var(--purple-soft);color:var(--purple-ink)}
.pill-flat{background:var(--line-soft);color:var(--ink-2)}
.pill-read{background:#EAF1F3;color:#14606D}
.pill-match{background:var(--purple-soft);color:var(--purple-ink);font-weight:500;font-size:11px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-pill);padding:10px 18px;font-weight:600;font-size:14.5px;transition:filter .12s,background .12s}
.btn:hover{filter:brightness(1.06)}
.btn-primary{background:var(--purple);color:#fff}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:transparent;color:var(--ink-2);border:1.5px solid var(--line)}
.btn-ghost:hover{background:var(--line-soft);filter:none}
.btn-danger{background:var(--coral);color:#fff}
.btn-sm{padding:7px 14px;font-size:13.5px}
.btn-full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}

.field{display:block;margin-bottom:14px}
.field .lb{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field .help{font-size:12.5px;color:var(--muted);margin-top:6px}
input[type=text],input[type=search],textarea,select{
  width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;transition:border-color .12s
}
input:focus,textarea:focus,select:focus{border-color:var(--purple);outline:none}
textarea{resize:vertical;min-height:76px}
.searchbar{position:relative;flex:1;min-width:230px}
.searchbar svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.searchbar input{padding-left:37px;border-radius:var(--r-pill)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);border-radius:var(--r-pill);padding:6px 13px;font-size:13px;color:var(--ink-2);font-weight:500}
.chip:hover{background:var(--line-soft)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.result-bar{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line-soft);font-size:13px;color:var(--muted)}
.result-bar button{color:var(--purple);font-weight:500;font-size:13px}

.kv{display:grid;grid-template-columns:150px 1fr;gap:10px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.empty{padding:44px 24px;text-align:center}
.empty h3{margin:0 0 6px;font-size:17px}
.empty p{margin:0 auto 16px;color:var(--muted);max-width:48ch;font-size:14px}
.note{border-left:3px solid var(--purple);background:var(--purple-soft);padding:12px 15px;border-radius:0 10px 10px 0;font-size:13.5px;color:var(--purple-ink)}
.note.warn{border-color:var(--gap);background:var(--gap-soft);color:#7A4A10}
.note.read{border-color:var(--teal);background:#EAF1F3;color:#14606D}
.worm{font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center}

.ctx{display:flex;align-items:center;gap:12px;background:var(--purple-soft);border:1px solid #DFD2F0;border-radius:12px;padding:11px 15px;margin-bottom:18px;font-size:13.5px;color:var(--purple-ink);flex-wrap:wrap}
.ctx .x{margin-left:auto;color:var(--purple-ink);opacity:.6;font-size:13px;padding:2px 6px}
.ctx .x:hover{opacity:1;text-decoration:underline}

.fold-head{display:flex;align-items:center;gap:9px;width:100%;text-align:left;font-size:14px;font-weight:600;padding:14px 20px}
.fold-head .chev{margin-left:auto;transition:transform .15s;color:var(--muted)}
.fold-head[aria-expanded=true] .chev{transform:rotate(90deg)}
.fold-body{padding:0 20px 18px}
.locked{display:flex;align-items:center;gap:8px;background:var(--line-soft);color:var(--ink-2);border-radius:var(--r-pill);padding:6px 12px;font-size:13px}

.plan-panel{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:15px 17px;margin-top:12px}
.plan-panel .ph{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.plan-link{font-weight:600;color:var(--purple);text-align:left}
.plan-link:hover{text-decoration:underline}

.pausecard{border:1px solid #EBDCBC;background:#FFFCF4;border-radius:12px;padding:14px 16px}
.pausecard + .pausecard{margin-top:10px}

.audit-row{display:grid;grid-template-columns:78px 1fr;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line-soft)}
.audit-row:last-child{border-bottom:0}
.audit-row .when{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);padding-top:2px}
.audit-row .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.audit-row .reason{font-size:13px;color:var(--ink-2);margin-top:6px;border-left:2px solid var(--line);padding-left:10px}

.tick{display:flex;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.tick:last-child{border-bottom:0}
.tick .sub{font-weight:600;font-size:14.5px}
.tick .body{font-size:13.5px;color:var(--ink-2);margin-top:3px;max-width:70ch}
.tick .from{font-size:12.5px;color:var(--muted);margin-top:6px}
.tick .act{margin-left:auto;flex:none;display:grid;gap:7px;justify-items:end}

/* ============ backstage ============ */
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:var(--r-pill);padding:4px;gap:2px;margin-bottom:20px;flex-wrap:wrap}
.seg button{border-radius:var(--r-pill);padding:8px 15px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.seg button:hover{background:var(--line-soft)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff;font-weight:600}
.seg .n{font-family:"IBM Plex Mono",monospace;font-size:11px;opacity:.7;margin-left:5px}
.sbadge{display:inline-flex;gap:5px;align-items:center;background:#EAF1F3;color:#14606D;border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.fbadge{display:inline-flex;gap:5px;align-items:center;background:#FDF3DC;color:#8A5A0B;border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.post{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:#fff}
.post + .post{margin-top:12px}
.post.pinned{border-color:#E2D2AB;background:#FFFDF7}
.post h3{font-size:16px;margin:0 0 6px;letter-spacing:-.01em}
.post .byline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.post .body{font-size:14px;color:var(--ink-2)}
.post .foot{display:flex;align-items:center;gap:14px;margin-top:12px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.post .foot .acts{margin-left:auto;display:flex;gap:7px}
.achip{display:inline-flex;align-items:center;gap:6px;background:var(--purple-soft);color:var(--purple-ink);border-radius:7px;padding:4px 9px;font-size:12px;font-weight:500}
.achip button{color:var(--purple-ink);opacity:.6;font-size:13px;line-height:1}
.achip button:hover{opacity:1}
.attach-row{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.attach-btn{border:1.5px solid var(--line);border-radius:var(--r-pill);padding:6px 12px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.attach-btn:hover{background:var(--line-soft)}
.inline-err{font-size:12.5px;color:#A63B21;background:var(--red-soft);border-radius:8px;padding:8px 11px;margin-top:8px}
.opt{margin-bottom:12px}
.opt .top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
.opt .top .pc{font-family:"IBM Plex Mono",monospace;color:var(--muted)}
.bar{height:8px;background:var(--line-soft);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--purple);border-radius:999px}
.flagcard{border:1px solid #EBC9BE;background:#FFFAF8;border-radius:12px;padding:15px 17px}
.flagcard + .flagcard{margin-top:12px}
.flagcard .excerpt{font-size:13.5px;color:var(--ink-2);border-left:2px solid #E3B6A6;padding-left:11px;margin:10px 0}

/* ============ gap annotation ============ */
.gap{position:relative}
body.gaps-on .gap{box-shadow:inset 0 -2px 0 0 var(--amber)}
body.gaps-on td.gap,body.gaps-on th.gap{background:#FDF8EE}
body.gaps-on .gap-block{outline:1.5px dashed var(--gap);outline-offset:3px;border-radius:8px}
.gap-tag{display:none}
body.gaps-on .gap-tag{
  display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;color:var(--gap);background:var(--gap-soft);border:1px solid #E9D3AC;
  border-radius:5px;padding:1px 6px;vertical-align:middle;margin-left:7px;font-weight:500
}
.legend{display:none}
body.gaps-on .legend{display:block}

/* ============ modal ============ */
.scrim{position:fixed;inset:0;background:rgba(30,26,22,.5);display:grid;place-items:center;padding:24px;z-index:40}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:548px;max-height:88vh;overflow-y:auto;box-shadow:0 40px 90px -30px rgba(0,0,0,.5)}
.modal-head{padding:22px 24px 0}
.modal-head h2{font-size:21px;letter-spacing:-.02em;margin:0 0 8px}
.modal-head p{margin:0;color:var(--ink-2);font-size:14px}
.modal-body{padding:20px 24px 4px}
.modal-foot{padding:16px 24px 22px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.ack{display:flex;gap:11px;align-items:flex-start;border:1.5px solid #E4C9A6;background:var(--gap-soft);border-radius:12px;padding:14px 15px;margin-bottom:16px;font-size:13.5px;color:#6E430D;text-align:left;width:100%}
.ack[aria-pressed=true]{border-color:var(--gap);background:#F7E6C9}
.ack .box{width:18px;height:18px;border:1.5px solid #B08A55;border-radius:5px;flex:none;margin-top:1px;display:grid;place-items:center;background:#fff}
.ack[aria-pressed=true] .box{background:var(--gap);border-color:var(--gap);color:#fff}
.ack .box svg{width:12px;height:12px;opacity:0}
.ack[aria-pressed=true] .box svg{opacity:1}

.toasts{position:fixed;bottom:22px;right:22px;display:grid;gap:10px;z-index:60}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:13px 17px;font-size:14px;box-shadow:0 18px 40px -16px rgba(0,0,0,.5);max-width:370px;display:flex;gap:10px}
.toast .tk{font-weight:600}
.toast svg{width:17px;height:17px;flex:none;margin-top:2px}

@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto}
  .page{padding:20px 16px 60px}
  .topbar{padding:12px 16px}
  .tick{flex-wrap:wrap}.tick .act{margin-left:0;justify-items:start}

}

/* ============================================================
   Routing — real hashes so account rows are openable in a new tab
============================================================ */
function routeToHash(v){
  if(v.name==='account') return '#/account/'+v.id;
  return '#/'+v.name;
}
function parseHash(){
  const h=(location.hash||'').replace(/^#\/?/,'');
  if(!h) return {name:'inbox'};
  const [a,b]=h.split('/');
  if(a==='account' && userById(b)) return {name:'account', id:b};
  if(['inbox','accounts','pauses','audit','plans','backstage'].includes(a)) return {name:a};
  return {name:'inbox'};
}
let suppressHash=false;
function go(name, id){
  S.view={name, id};
  const h=routeToHash(S.view);
  if(location.hash!==h){ suppressHash=true; location.hash=h; }
  window.scrollTo(0,0);
  render();
}
window.addEventListener('hashchange', ()=>{
  if(suppressHash){ suppressHash=false; return; }
  S.view=parseHash();
  render();
});

}

/* ============================================================
   Accounts — one list over logins and households
============================================================ */
function matchWhy(u,q){
  if(!q) return null;
  const o=orgById(u.org);
  if(u.email.toLowerCase().includes(q)) return null;          // the obvious match needs no label
  if(u.id.toLowerCase().includes(q)) return 'user ID';
  if(o && o.name.toLowerCase().includes(q)) return 'household name';
  if(o && o.id.toLowerCase().includes(q)) return 'household ID';
  return null;
}
function matchesQuery(u,q){
  if(!q) return true;
  const o=orgById(u.org);
  return u.email.toLowerCase().includes(q) || u.id.toLowerCase().includes(q) ||
         (o && (o.name.toLowerCase().includes(q) || o.id.toLowerCase().includes(q)));
}
function filteredAccounts(){
  const q=S.q.accounts.trim().toLowerCase();
  return S.users.filter(u=>{
    if(S.statusFilter!=='all' && u.status!==S.statusFilter) return false;
    return matchesQuery(u,q);
  });
}

function accountsResultsHTML(){
  const q=S.q.accounts.trim();
  const rows=filteredAccounts();
  const bar = `<div class="result-bar">
    <span>${rows.length} ${rows.length===1?'account':'accounts'}${q?` matching “${esc(q)}”`:''}${S.statusFilter!=='all'?` &middot; ${S.statusFilter} only`:''}</span>
    ${(q||S.statusFilter!=='all')?`<button data-act="clearsearch">Clear filters</button>`:''}

  if(!rows.length){

      <p>${isEmail
        ? `Nothing on the platform is registered to <span class="mono">${esc(q)}</span>. The person writing in may be a second parent who was never added as a learning coach, or they may be using a different address than the one on the account. Try the household name instead.`
        : `Try a full email address, a user ID like <span class="mono">u_8841</span>, or a household name.`}</p>
      <button class="btn btn-ghost" data-act="clearsearch">Clear filters</button>
    </div>`;
  }

  return bar+`
  <table>
    <thead><tr>
      <th>Email</th>
      <th>Sign-in</th>

      <th class="gap">Status</th>

        <td>
          <a class="rowlink" href="#/account/${u.id}" data-act="go" data-name="account" data-id="${u.id}">${esc(u.email)}</a>
          ${why?`<span class="pill pill-match">matched ${esc(why)}</span>`:''}
          <div class="t-sub mono">${u.id}${u.trial?' &middot; trial':''}${u.onboarded?'':' &middot; onboarding not finished'}</div>
        </td>
        <td><span class="pill pill-flat">${esc(u.provider)}</span></td>
        <td class="gap">${o?`<div>${esc(o.name)}</div><div class="t-sub mono">${o.id} &middot; ${o.status}</div>`:'<span class="t-sub">—</span>'}</td>
        <td class="gap">${statusPill(u.status)}</td>
        <td class="num">${u.profiles}</td>

/* ============================================================
   One confirmation component for all three writes
============================================================ */
function openConfirm(cfg, triggerKey){
  S.modal={
    cfg,
    v:{reason:'', ref:cfg.refPrefill||(S.ticket?S.ticket.id:''), outcome:''},
    ack:false,
    triggerKey:triggerKey||null
  };
  renderModal();
}

function modalReady(){
  const m=S.modal; if(!m) return false;
  const c=m.cfg;
  if(!m.v.reason.trim()) return false;
  if(c.refRequired!==false && !m.v.ref.trim()) return false;
  if(c.outcome && !m.v.outcome) return false;
  if(c.ack && !m.ack) return false;
  return true;
}

function modalHTML(){
  const m=S.modal, c=m.cfg;
  const reasonPlaceholder = S.ticket
    ? `Re: ${S.ticket.subject} — what did the customer ask for, and what did you verify?`
    : (c.reasonPlaceholder||'What did the customer ask for, and what did you verify?');
  return `
  <div class="scrim" data-act="scrim">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title">${c.title}</h2>
        <p>${c.lead}</p>
      </div>
      <div class="modal-body">
        ${c.consequences&&c.consequences.length?`
        <div class="disclose" style="margin-bottom:16px">
          <div class="em" style="font-size:14px">What happens</div>
          <ul>${c.consequences.map(x=>`<li>${x}</li>`).join('')}</ul>
        </div>`:''}

        ${c.ack?`
        <button class="ack" data-act="ack" aria-pressed="${m.ack}">
          <span class="box">${I.check}</span><span>${c.ack}</span>
        </button>`:''}

        ${c.outcome?`
        <label class="field">
          <span class="lb">Resolution</span>
          <select data-act="outcome">
            <option value="">Choose an outcome</option>
            ${c.outcome.map(([v,l])=>`<option value="${v}" ${m.v.outcome===v?'selected':''}>${l}</option>`).join('')}
          </select>
        </label>`:''}

        <label class="field">
          <span class="lb">${c.reasonLabel||'Reason'}</span>
          <textarea data-act="reason" placeholder="${esc(reasonPlaceholder)}">${esc(m.v.reason)}</textarea>
          <span class="help">Written to the append-only log and can't be edited later. This is the record of why, so write what the next person would need.</span>
        </label>
        <label class="field">
          <span class="lb">${c.refLabel||'Ticket reference'}</span>
          <input type="text" data-act="ref" placeholder="${esc(c.refPlaceholder||'SM-1042')}" value="${esc(m.v.ref)}">
          <span class="help">${c.refHelp
            || (S.ticket?'Prefilled from the ticket you are working.':'Ties this write back to the request that prompted it.')}</span>
        </label>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-act="closemodal">Cancel</button>
        <button class="btn ${c.destructive?'btn-danger':'btn-primary'}" data-act="confirm" ${modalReady()?'':'disabled'}>${c.cta}</button>
      </div>
    </div>
  </div>`;
}

function renderModal(){
  const root=el('modal-root');
  if(!S.modal){ root.innerHTML=''; return; }
  root.innerHTML=modalHTML();
  const first=root.querySelector('textarea,input,select,button:not([disabled])');
  if(first) first.focus();
}
// Enable/disable composer buttons without re-rendering the field being typed in.
function syncPublish(){
  const b=document.querySelector('[data-act="publishpost"]');
  if(b) b.disabled=!(S.draft.title.trim()&&S.draft.body.trim());
}
function syncCreatePoll(){
  const b=document.querySelector('[data-act="createpoll"]');
  const d=S.pollDraft; if(!b||!d) return;
  b.disabled=!(d.q.trim() && d.options.filter(o=>o.trim()).length>=2 && d.closes.trim());
}
function syncModalConfirm(){
  const b=el('modal-root').querySelector('[data-act="confirm"]');
  if(b) b.disabled=!modalReady();
}
function closeModal(){
  const key=S.modal?S.modal.triggerKey:null;
  S.modal=null;
  renderModal();
  if(key){
    const t=document.querySelector(`[data-focus-key="${key}"]`);
    if(t) t.focus();
  }
}
function focusables(root){
  return [...root.querySelectorAll('a[href],button:not([disabled]),input,select,textarea')]
    .filter(x=>x.offsetParent!==null);
}

/* ---- the three writes, expressed through the one component ---- */
function confirmUserStatus(id,to,key){
  const u=userById(id), off=to==='deactivated';
  openConfirm({
    title:`${off?'Deactivate':'Reactivate'} ${esc(u.email)}?`,
    lead: off
      ? 'This login stops working immediately. Nothing else about the family changes.'
      : 'This login starts working again on the next sign-in attempt.',
    consequences: off?[
      'Sign-in fails for this email with a message pointing them to support.',
      'Learner profiles, lesson history, and evidence uploads are untouched.',
      'The household stays active and billing continues unchanged.',
      'Other logins in the household keep working.'
    ]:[],
    cta: off?'Deactivate user':'Reactivate user',
    destructive: off,
    onConfirm(){
      u.status=to;
      logAudit({action:off?'Deactivated user':'Reactivated user', target:u.email,
        reason:S.modal.v.reason.trim(), ref:S.modal.v.ref.trim()});
      toast(off?'User deactivated':'User reactivated', u.email+' — logged with your reason');
    }
  },key);
}

function confirmOrgStatus(id,to,key){
  const o=orgById(id), off=to==='deactivated';
  const logins=S.users.filter(u=>u.org===o.id).length;
  const needsAck = off && !!o.parentPause;
  openConfirm({
    title:`${off?'Deactivate':'Reactivate'} ${esc(o.name)}?`,
    lead: off
      ? 'Every login in this household loses access, and billing stops at the end of the current cycle.'
      : 'Access returns for every login in this household and billing resumes next cycle.',
    consequences: off?[
      `${o.seats} learner ${o.seats===1?'seat':'seats'} lose access to lessons and evidence uploads.`,
      `All ${logins} logins in the household stop working, including the account owner.`,
      'Billing stops at the end of the current cycle. No refund is issued by this action.',
      'Lesson history is retained and returns intact on reactivation.'
    ]:[],
    ack: needsAck
      ? `<strong>This family already paused their own billing</strong> on <span class="mono">${esc(o.parentPause.requested)}</span>. Deactivating overrides that pause and replaces their choice with a staff decision. I have a reason to override it.`
      : null,
    cta: off?'Deactivate household':'Reactivate household',
    destructive: off,
    onConfirm(){
      const overrode = off && !!o.parentPause;
      o.status=to;
      if(overrode) o.parentPause=null;
      logAudit({action:off?'Deactivated org':'Reactivated org', target:o.id+' — '+o.name,
        reason:S.modal.v.reason.trim(), ref:S.modal.v.ref.trim(), override:overrode});
      toast(off?'Household deactivated':'Household reactivated',
        overrode?'Family billing pause overridden and logged':o.name);
    }
  },key);
}

function confirmPause(id,key){
  const p=S.pauses.find(x=>x.id===id), o=orgById(p.org);
  openConfirm({
    title:`Clear pause ${p.id}`,
    lead:`${esc(o.name)} has been stuck in manual review for ${p.days} days. The household is currently ${o.status}. Pick how it should land.`,
    consequences:[esc(p.detail)],
    outcome:[
      ['completed','Complete the pause as the family requested'],
      ['cancelled','Cancel the pause and keep the account billing'],
      ['escalated','Send to billing engineering with notes']
    ],
    reasonLabel:'What you found',
    reasonPlaceholder:'What was blocking it, and what did you do about it?',
    cta:'Clear this pause',
    onConfirm(){
      const m=S.modal;
      const label={completed:'Completed pause',cancelled:'Cancelled pause',escalated:'Escalated pause'}[m.v.outcome];
      S.pauses=S.pauses.filter(x=>x.id!==p.id);
      logAudit({action:label, target:p.id+' — '+o.name, reason:m.v.reason.trim(), ref:m.v.ref.trim()});
      toast('Pause cleared', p.id+' left the queue');
    }
  },key);
}

/* ---- Backstage moderation, through the same confirm component ---- */
function flagById(id){ return S.bsFlags.find(f=>f.id===id); }

function confirmRemoveContent(id,key){
  const f=flagById(id);
  openConfirm({
    title:`Remove this ${esc(f.kind)}?`,
    lead:`It disappears from Backstage for every member. ${esc(f.who)} keeps their access.`,
    consequences:[
      'The content is removed from the feed and from search.',
      'The author is not notified by this action on its own.',
      'The flag leaves the moderation queue.'
    ],
    cta:`Remove ${esc(f.kind)}`,
    destructive:true,
    refLabel:'Flag or ticket reference',
    refPlaceholder:f.id,
    refPrefill:f.id,
    refHelp:'Prefilled from the flag that surfaced this.',
    onConfirm(){
      S.bsFlags=S.bsFlags.filter(x=>x.id!==f.id);
      logAudit({action:'Removed Backstage '+f.kind, target:f.target,
        reason:S.modal.v.reason.trim(), ref:S.modal.v.ref.trim()});
      toast('Content removed', f.target);
    }
  },key);
}

function confirmRemoveMember(orgId, flagId, key){
  const o=orgById(orgId), owner=userById(o.owner), f=flagId?flagById(flagId):null;
  openConfirm({
    title:`Remove ${esc(o.name)} from Backstage?`,
    lead:'They lose the Backstage space. Their subscription, their learners, and their logins are untouched.',
    consequences:[
      'Backstage disappears from their navigation on the next access check.',
      'Their existing posts and replies stay unless you remove them separately.',
      'They keep Founding Member status — this console cannot revoke that.',
      'Nothing about billing, lessons, or sign-in changes.'
    ],
    cta:'Remove from Backstage',
    destructive:true,
    refLabel:'Flag or ticket reference',
    refPlaceholder:f?f.id:'SM-1042',
    refPrefill:f?f.id:'',
    refHelp:f?'Prefilled from the flag that surfaced this.':'Ties this removal to what prompted it.',
    onConfirm(){
      o.bsRemoved=true;
      if(f) S.bsFlags=S.bsFlags.filter(x=>x.id!==f.id);
      logAudit({action:'Removed member from Backstage',
        target:o.id+' — '+(owner?owner.email:o.name),
        reason:S.modal.v.reason.trim(), ref:S.modal.v.ref.trim()});
      toast('Member removed from Backstage', o.name+' — account and billing untouched');
    }
  },key);
}

function confirmEscalate(id,key){
  const f=flagById(id);
  openConfirm({
    title:'Escalate this flag',
    lead:'Hands the decision to whoever owns community policy. The content stays visible until someone acts.',
    consequences:[
      'The flag leaves your queue and is recorded as escalated.',
      'The content is not removed by escalating.'
    ],
    cta:'Escalate',
    refLabel:'Flag or ticket reference',
    refPlaceholder:f.id,
    refPrefill:f.id,
    refHelp:'Prefilled from the flag that surfaced this.',
    reasonLabel:'What needs a decision',
    reasonPlaceholder:'What is ambiguous here, and what would you need to resolve it?',
    onConfirm(){
      S.bsFlags=S.bsFlags.filter(x=>x.id!==f.id);
      logAudit({action:'Escalated Backstage flag', target:f.target,
        reason:S.modal.v.reason.trim(), ref:S.modal.v.ref.trim()});
      toast('Flag escalated', f.target);
    }
  },key);
}

/* ============================================================
   Render + events
============================================================ */
function render(){
  document.body.classList.toggle('gaps-on', S.showGaps);
  el('root').innerHTML = S.signedIn ? viewShell() : viewSignin();
  renderModal();
  if(!S.signedIn && S.wantFocus){
    S.wantFocus=false;
    const f = el('username');
    if(f) f.focus();
  }
}

document.addEventListener('click', e=>{
  const t=e.target.closest('[data-act]');
  if(!t) return;
  const a=t.dataset.act;

  if(a==='scrim'){ if(e.target===t) closeModal(); return; }
  if(a==='noop'){ e.preventDefault(); return; }

  // Real links: let modified clicks (new tab, middle-click) through.
  if(t.tagName==='A' && (e.metaKey||e.ctrlKey||e.shiftKey||e.button===1)) return;
  if(t.tagName==='A') e.preventDefault();

  switch(a){
    /* --- sign-in --- */
    case 'remember': S.remember=!S.remember; render(); break;
    case 'customer-signin':
      S.signinMsg='Family accounts sign in here. This build only demonstrates the staff path — use the bolt below.';
      render(); break;
    case 'signin': S.signedIn=true; go('inbox'); break;
    case 'signout':
      S={...S, signedIn:false, signinMsg:'', ticket:null, from:null,
         q:{accounts:''}, statusFilter:'all', planPanel:null, view:{name:'inbox'}, wantFocus:true};
      history.replaceState(null,'',location.pathname+location.search);
      render(); break;

    /* --- navigation --- */
    case 'go': go(t.dataset.name, t.dataset.id); break;
    case 'rowgo':
      if(e.target.closest('a')) return;   // the link handles itself
      go('account', t.dataset.id); break;
    case 'back': {
      const v=S.view;
      if(v.name==='account') go(S.from==='inbox'?'inbox':'accounts');
      else if(v.name==='plans') go('accounts');
      else go('inbox');
      break;
    }
    case 'lookup': {
      const tk=ticketById(t.dataset.id);
      S.ticket={id:tk.id, subject:tk.subject, email:tk.email};
      S.from='inbox';
      S.q.accounts=tk.email;
      S.statusFilter='all';
      const u=S.users.find(x=>x.email===tk.email);
      if(u) go('account', u.id); else go('accounts');
      break;
    }
    case 'dropticket': S.ticket=null; S.from=null; render(); break;

    /* --- list controls --- */
    case 'gaps': S.showGaps=!S.showGaps; render(); break;
    case 'filter':
      S.statusFilter=t.dataset.k;
      el('acct-results').innerHTML=accountsResultsHTML();
      document.querySelectorAll('[data-act="filter"]').forEach(c=>
        c.setAttribute('aria-pressed', String(c.dataset.k===S.statusFilter)));
      break;
    case 'clearsearch':
      S.q.accounts=''; S.statusFilter='all'; render();
      { const box=el('q-accounts'); if(box) box.focus(); }
      break;

    /* --- disclosures --- */
    case 'planpanel':
      S.planPanel = S.planPanel===t.dataset.code ? null : t.dataset.code;
      render(); break;
    case 'foldlocked': S.foldLocked=!S.foldLocked; render(); break;

    /* --- backstage --- */
    case 'bstab': S.bsTab=t.dataset.k; S.bsPrompt=null; render(); break;
    case 'gobs': S.bsTab=t.dataset.tab||'feed'; go('backstage'); break;
    case 'bsprompt': S.bsPrompt=t.dataset.id||null; render(); break;
    case 'attach': {
      const kind=t.dataset.t;
      if(kind==='pdf'){
        S.draft.err='PDF is not a supported attachment in Backstage. Post a link to the file instead, or attach a video, audio clip, or GIF.';
      } else {
        const sample={video:'walkthrough.mp4', link:'strongmind.com/roadmap', audio:'voice-note.m4a', gif:'reaction.gif'}[kind];
        S.draft.attach.push({t:kind, label:sample});
        S.draft.err='';
      }
      render(); break;
    }
    case 'unattach': S.draft.attach.splice(Number(t.dataset.i),1); render(); break;
    case 'publishpost': {
      const d=S.draft;
      if(!d.title.trim()||!d.body.trim()) break;
      S.bsPosts.unshift({id:'bs_'+Math.floor(Math.random()*900+100), author:STAFF.person.name,
        role:STAFF.label, when:'today', pinned:false, pinOrder:0,
        title:d.title.trim(), body:d.body.trim(), attach:d.attach.slice(), reactions:0, replies:0});
      logAudit({action:'Published Backstage roadmap update', target:d.title.trim(), reason:'', ref:''});
      S.draft={title:'', body:'', attach:[], err:''};
      toast('Update published', 'Visible to every Founding Member');
      render(); break;
    }
    case 'pin': {
      const kind=t.dataset.kind;
      const list = kind==='poll'?S.bsPolls:S.bsPosts;
      const item=list.find(x=>x.id===t.dataset.id);
      const maxOrder=Math.max(0,...pinnedItems().map(x=>x.pinOrder));
      item.pinned=true; item.pinOrder=maxOrder+1;
      logAudit({action:'Pinned Backstage '+kind, target:kind==='poll'?item.q:item.title, reason:'', ref:''});
      toast('Pinned to the top of Backstage');
      render(); break;
    }
    case 'unpin': {
      const kind=t.dataset.kind;
      const list = kind==='poll'?S.bsPolls:S.bsPosts;
      const item=list.find(x=>x.id===t.dataset.id);
      item.pinned=false; item.pinOrder=0;
      logAudit({action:'Unpinned Backstage '+kind, target:kind==='poll'?item.q:item.title, reason:'', ref:''});
      toast('Unpinned', 'Back to its date order in the feed');
      render(); break;
    }
    case 'pinup': {
      const pins=pinnedItems();
      const i=pins.findIndex(x=>x.id===t.dataset.id);
      if(i>0){
        const a=pins[i], b=pins[i-1];
        const findIn=x=>(x.type==='poll'?S.bsPolls:S.bsPosts).find(y=>y.id===x.id);
        const oa=findIn(a), ob=findIn(b);
        const tmp=oa.pinOrder; oa.pinOrder=ob.pinOrder; ob.pinOrder=tmp;
      }
      render(); break;
    }
    case 'newpoll': S.pollDraft={q:'', options:['','',''], opens:'2026-09-05', closes:''}; render(); break;
    case 'cancelpoll': S.pollDraft=null; render(); break;
    case 'poll-addopt': S.pollDraft.options.push(''); render(); break;
    case 'createpoll': {
      const d=S.pollDraft;
      S.bsPolls.unshift({id:'bs_poll_'+Math.floor(Math.random()*90+10), q:d.q.trim(),
        opens:d.opens.trim()||'today', closes:d.closes.trim(), state:'open', pinned:false, pinOrder:0,
        options:d.options.filter(o=>o.trim()).map(o=>({l:o.trim(), v:0}))});
      logAudit({action:'Published Backstage poll', target:d.q.trim(), reason:'', ref:''});
      S.pollDraft=null;
      toast('Poll published', 'Open until '+(d.closes.trim()||'—'));
      render(); break;
    }
    case 'closepoll': {
      const poll=S.bsPolls.find(x=>x.id===t.dataset.id);
      poll.state='closed';
      logAudit({action:'Closed Backstage poll', target:poll.q, reason:'', ref:''});
      toast('Poll closed', 'It stays in Backstage with its final tally');
      render(); break;
    }
    case 'removecontent': confirmRemoveContent(t.dataset.id, t.dataset.focusKey); break;
    case 'removemember': confirmRemoveMember(t.dataset.id, t.dataset.flag, t.dataset.focusKey); break;
    case 'escalate': confirmEscalate(t.dataset.id, t.dataset.focusKey); break;
    case 'dismissflag': {
      const f=flagById(t.dataset.id);
      S.bsFlags=S.bsFlags.filter(x=>x.id!==f.id);
      logAudit({action:'Cleared Backstage flag with no action', target:f.target, reason:'', ref:''});
      toast('Flag cleared', 'No action taken');
      render(); break;
    }

    /* --- writes --- */
    case 'userstatus': confirmUserStatus(t.dataset.id, t.dataset.to, t.dataset.focusKey); break;
    case 'orgstatus': confirmOrgStatus(t.dataset.id, t.dataset.to, t.dataset.focusKey); break;
    case 'resolvepause': confirmPause(t.dataset.id, t.dataset.focusKey); break;
    case 'closemodal': closeModal(); break;
    case 'ack': S.modal.ack=!S.modal.ack; renderModal(); break;
    case 'confirm': {
      if(!modalReady()) break;
      const key=S.modal.triggerKey;
      S.modal.cfg.onConfirm();
      S.modal=null;
      render();
      if(key){ const b=document.querySelector(`[data-focus-key="${key}"]`); if(b) b.focus(); }
      break;
    }
  }
});

document.addEventListener('input', e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act;
  if(a==='search'){
    S.q.accounts=t.value;
    el('acct-results').innerHTML=accountsResultsHTML();   // results only; input keeps focus and caret
    return;
  }
  if(a==='draft-title'){ S.draft.title=t.value; syncPublish(); return; }
  if(a==='draft-body'){ S.draft.body=t.value; syncPublish(); return; }
  if(a==='poll-q'){ S.pollDraft.q=t.value; syncCreatePoll(); return; }
  if(a==='poll-opt'){ S.pollDraft.options[Number(t.dataset.i)]=t.value; syncCreatePoll(); return; }
  if(a==='poll-opens'){ S.pollDraft.opens=t.value; return; }
  if(a==='poll-closes'){ S.pollDraft.closes=t.value; syncCreatePoll(); return; }
  if(!S.modal) return;
  if(a==='reason'){ S.modal.v.reason=t.value; syncModalConfirm(); }
  if(a==='ref'){ S.modal.v.ref=t.value; syncModalConfirm(); }
});

document.addEventListener('change', e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  if(t.dataset.act==='outcome' && S.modal){ S.modal.v.outcome=t.value; syncModalConfirm(); }
});

document.addEventListener('keydown', e=>{
  // Enter in the customer password field fires the primary button
  if(!S.signedIn && e.key==='Enter' && e.target.id==='password'){
    e.preventDefault();
    const b=el('customer-signin'); if(b) b.click();
    return;
  }
  if(!S.modal) return;
  if(e.key==='Escape'){ e.preventDefault(); closeModal(); return; }
  if(e.key!=='Tab') return;
  const f=focusables(el('modal-root'));
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  else if(!el('modal-root').contains(document.activeElement)){ e.preventDefault(); first.focus(); }
});

if(location.hash) S.view=parseHash();
render();
</script>
