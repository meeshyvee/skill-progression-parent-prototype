<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StrongMind Homeschool · Support prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --primary:#7E4BA3; --primary-dark:#4D1A72; --primary-darker:#1D0042; --primary-light:#B182D2; --primary-lighter:#D0B4E4; --primary-subtle:#E0CEED; --primary-wash:#F3EEF8;
  --teal:#008FA9; --teal-dark:#004D67; --teal-light:#37B6CC; --teal-subtle:#D7F0F5;
  --coral:#F87760; --coral-dark:#DE5D46; --coral-subtle:#FEE8E4; --coral-lighter:#FCCEC6;
  --yellow:#FFBD26; --yellow-hover:#E59700; --yellow-subtle:#FFF2D4; --yellow-lighter:#FFE3A3;
  --green:#3AA97A; --green-dark:#097849; --green-subtle:#C7EFDF;
  --pink:#FFA4AA; --pink-subtle:#FFF0F1;
  --bg:#F9F6F3; --bg-medium:#F1EBE3; --sand:#E4D8CC; --sand-base:#CEB7A3; --sand-dark:#BA977D; --brown:#2E1F1C;
  --white:#FFFFFF; --text:#262626; --text-2:#525252; --text-3:#737373; --border:#D4D4D4; --border-soft:#E9E2DA; --border-hover:#A3A3A3;
  --error:#CD4C35; --error-dark:#9C1B04; --error-light:#FCCEC6;
  --font-head:"Poppins", "Segoe UI", system-ui, sans-serif;
  --font-body:"Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-sm:4px; --r-md:6px; --r-lg:8px; --r-xl:12px; --r-2xl:16px; --r-3xl:24px; --r-full:9999px;
  --lift: 0 8px 22px -12px rgba(77,26,114,.45);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px); background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; font-family:var(--font-body); font-size:15px; line-height:1.5; color:var(--text); background:var(--bg); -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-head); font-weight:600; margin:0; color:var(--text); letter-spacing:-.01em}
p{margin:0}
a{color:var(--primary)}
button{font:inherit; color:inherit; cursor:pointer}
input,textarea,select{font:inherit; color:var(--text)}
svg.i{width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
:focus-visible{outline:2px solid var(--primary); outline-offset:2px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

/* ---------- Shell ---------- */
.app{display:grid; grid-template-columns:218px 1fr; min-height:100vh}
.sidebar{background:var(--white); border-right:1px solid var(--border-soft); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; z-index:30}
.logo{display:flex; align-items:center; gap:4px; padding:24px 0 0 36px; font-family:var(--font-head); font-weight:600; font-size:19px; color:#F29A2E; letter-spacing:-.02em}
.logo svg{width:26px; height:26px}
.who{text-align:center; padding:36px 16px 40px}
.avatar{width:54px; height:54px; border-radius:50%; display:inline-grid; place-items:center; color:#fff; font-family:var(--font-head); font-weight:600; font-size:24px}
.who h2{font-size:17px; margin-top:12px}
.who p{font-size:10.5px; color:var(--text-2); margin-top:2px}
.nav{padding:0 22px; display:flex; flex-direction:column; gap:8px}
.nav-item{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--r-lg); font-size:13px; color:var(--text); text-decoration:none; border:0; background:none; width:100%; text-align:left}
.nav-item:hover{background:var(--bg)}
.nav-item.active{background:#F2EEF7}
.nav-item svg.i{width:17px; height:17px}
.nav-item .new{margin-left:auto; font-size:10px; font-weight:800; color:var(--primary-dark); background:var(--primary-subtle); padding:1px 7px; border-radius:var(--r-full)}
.nav-label{font-family:var(--font-head); font-weight:600; font-size:11px; letter-spacing:.18em; padding:28px 22px 10px; color:var(--text)}
.learner-dot{width:22px; height:22px; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:9px; font-weight:700}
.sidebar-foot{margin-top:auto; border-top:1px solid var(--border-soft); padding:22px; text-align:center; font-size:13px}
.main{min-width:0; display:flex; flex-direction:column}
.topbar{height:77px; background:var(--white); border-bottom:1px solid var(--border-soft); display:flex; align-items:center; gap:16px; padding:0 22px 0 32px; position:sticky; top:0; z-index:20}
.icon-btn{width:36px; height:36px; border-radius:var(--r-lg); display:grid; place-items:center; border:1px solid var(--border-soft); background:var(--white); color:var(--text-2)}
.icon-btn.plain{border:0}
.icon-btn.yellow{border-color:var(--yellow); background:var(--yellow-subtle); color:var(--yellow-hover)}
.crumbs{display:flex; align-items:center; gap:10px; font-size:13px; flex-wrap:wrap; min-width:0}
.crumbs a{color:var(--text); text-decoration:underline; text-underline-offset:3px}
.crumbs span.sep{color:var(--text-3)}
.top-right{margin-left:auto; display:flex; gap:10px}
.menu-btn{display:none}
.content{padding:24px 32px 120px; max-width:1240px; width:100%}

/* ---------- Buttons & bits ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; height:42px; padding:0 22px; border-radius:var(--r-full); border:1.5px solid transparent; font-weight:700; font-size:14px; text-decoration:none; white-space:nowrap; transition:background .15s, border-color .15s}
.btn svg.i{width:17px; height:17px}
.btn-primary{background:var(--primary); color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-teal{background:var(--teal); color:#fff}
.btn-teal:hover{background:var(--teal-dark)}
.btn-outline{border-color:var(--primary); color:var(--primary); background:var(--white)}
.btn-outline:hover{background:var(--primary-wash)}
.btn-quiet{background:transparent; color:var(--text-2)}
.btn-quiet:hover{background:var(--bg-medium)}
.btn-danger{background:var(--error); color:#fff}
.btn-danger:hover{background:var(--error-dark)}
.btn-sm{height:34px; padding:0 14px; font-size:13px}
.link-btn{background:none; border:0; padding:0; color:var(--primary); font-weight:700; text-decoration:underline; text-underline-offset:3px}
.chip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:var(--r-full); white-space:nowrap}
.chip svg.i{width:13px; height:13px}
.chip-purple{background:var(--primary-subtle); color:var(--primary-dark)}
.chip-teal{background:var(--teal-subtle); color:var(--teal-dark)}
.chip-sand{background:var(--bg-medium); color:var(--brown)}
.chip-yellow{background:var(--yellow-subtle); color:#6B4A00; border:1px solid var(--yellow-lighter)}
.chip-red{background:var(--coral-subtle); color:var(--error-dark)}
.chip-green{background:var(--green-subtle); color:var(--green-dark)}
.panel{background:var(--white); border-radius:var(--r-3xl); border:1px solid var(--border-soft)}
.section{margin-top:44px}
.section-head{display:flex; align-items:end; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap}
.section-head h2{font-size:21px; display:flex; align-items:center; gap:10px}
.section-head p{color:var(--text-2); font-size:14px; margin-top:4px}
.swish{display:inline-block; width:18px; height:18px; color:var(--sand-dark)}
.muted{color:var(--text-3)}

/* segmented control, matches Today's Plan / Previous Lessons */
.seg{display:inline-flex; background:var(--white); border:1px solid var(--border-soft); padding:4px; border-radius:var(--r-full); gap:2px}
.seg a,.seg button{display:inline-flex; align-items:center; gap:8px; padding:8px 20px; border-radius:var(--r-full); text-decoration:none; color:var(--text-3); font-family:var(--font-head); font-weight:500; font-size:14px; border:0; background:none}
.seg a.on,.seg button.on{background:#333; color:#fff}
.seg a:not(.on):hover,.seg button:not(.on):hover{color:var(--text)}
.seg svg.i{width:16px; height:16px}
.seg-wrap{display:flex; justify-content:center; margin:28px 0 8px}

/* ---------- Hero ---------- */
.hero{position:relative; background:var(--bg-medium); border-radius:var(--r-3xl); padding:46px 32px 0; text-align:center; overflow:visible}
.hero-art{position:absolute; inset:0; border-radius:var(--r-3xl); overflow:hidden; pointer-events:none}
.hero-art svg{position:absolute; height:100%}
.hero h1{position:relative; font-size:34px; line-height:1.15; letter-spacing:-.02em}
.hero > p{position:relative; color:var(--text-2); margin-top:10px; font-size:15.5px}
.searchbar{position:relative; max-width:640px; margin:28px auto 0; transform:translateY(32px); display:flex; align-items:center; gap:10px; background:var(--white); border:1.5px solid var(--primary-light); border-radius:var(--r-full); padding:8px 8px 8px 22px; box-shadow:var(--lift)}
.searchbar svg.i{color:var(--primary); width:22px; height:22px}
.searchbar input{flex:1; min-width:0; border:0; outline:0; font-size:17px; background:transparent; padding:10px 0}
.searchbar input::placeholder{color:var(--text-3)}
.searchbar:focus-within{border-color:var(--primary); box-shadow:0 0 0 4px var(--primary-subtle), var(--lift)}
.popular{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:52px; font-size:13px; color:var(--text-2); align-items:center}
.popular button{background:var(--white); border:1px solid var(--border-soft); border-radius:var(--r-full); padding:5px 13px; font-size:13px; color:var(--text)}
.popular button:hover{border-color:var(--primary-light); color:var(--primary-dark)}

.welcome{display:flex; gap:16px; align-items:flex-start; background:var(--white); border:1.5px solid var(--primary-lighter); border-radius:var(--r-2xl); padding:18px 20px; margin-bottom:22px}
.welcome .badge-ic{width:42px; height:42px; border-radius:var(--r-xl); background:var(--primary-subtle); color:var(--primary-dark); display:grid; place-items:center; flex:none}
.welcome h3{font-size:16px}
.welcome p{color:var(--text-2); font-size:14px; margin-top:3px}
.welcome .icon-btn{margin-left:auto}




.gb-jump{display:flex; gap:8px; flex-wrap:wrap; position:sticky; top:77px; z-index:5; background:var(--bg); padding:10px 0 12px; margin-bottom:6px}
.gb-jump button{display:inline-flex; gap:8px; align-items:center; border:1px solid var(--border-soft); background:var(--white); border-radius:var(--r-full); padding:5px 14px 5px 6px; font-weight:800; font-size:13.5px}
.gb-jump button:hover{border-color:var(--primary-light)}
.gbl{display:grid; grid-template-columns:220px minmax(0,1fr); gap:28px; align-items:start; border-top:1px solid var(--sand); padding:24px 0; scroll-margin-top:140px; transition:background .3s}
.gbl:last-child{border-bottom:1px solid var(--sand)}
.gbl.focus{background:linear-gradient(90deg, var(--primary-wash), transparent 60%); border-radius:var(--r-xl); padding-left:14px; margin-left:-14px}
.gbl-head{display:flex; flex-direction:column; align-items:flex-start; gap:8px; position:sticky; top:150px}
.gbl-head .avatar{width:48px; height:48px; font-size:21px}
.gbl-ht{min-width:0}
.gbl-ht h2{font-size:20px}
.gbl-ht .gb-title{gap:8px}
.gbl-ht p{color:var(--text-2); font-size:13px; margin-top:4px; line-height:1.4}
.gbl-head .hh-open{margin-left:0; font-size:13px}
.gb-clist.two{grid-template-columns:1fr; gap:8px; margin-top:0}
.gbl .gb-course{background:var(--white); border:1px solid var(--border); border-radius:var(--r-xl); padding:12px 16px; gap:16px}
.gbl .gb-course:hover{border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-wash)}
.gbl .gb-course.removed{background:repeating-linear-gradient(135deg, #fff, #fff 10px, #FAF7F4 10px, #FAF7F4 20px)}
.gbl .gb-course .cat-ic{width:40px; height:40px}
.gbl .gb-course .cat-ic svg.i{width:20px; height:20px}
.gbl .gb-ctitle h3{font-size:16px}
.gbl .gb-cmain p{margin-top:2px; font-size:13px}
.gbl .gb-grade b{font-size:22px}
.gbl .gb-prog b{font-size:20px}
.gbl .hh-none{background:var(--white); border:1px dashed var(--border); margin:0}
.gbl-prev{display:flex; align-items:center; gap:10px; background:none; border:0; padding:12px 2px 0; font-family:var(--font-head); font-weight:600; font-size:15px; width:100%; text-align:left}
.gbl-prev .muted{margin-left:auto; font-family:var(--font-body); font-size:13px; font-weight:600}
.gbl-prev + .gb-clist{margin-top:10px}
.lj-actions{display:flex; gap:10px; flex-wrap:wrap}
.lj-head .assume{flex-basis:100%; justify-content:flex-start; width:fit-content; margin-left:auto}
@media (max-width:900px){ .gbl{grid-template-columns:1fr; gap:14px} .gbl-head{position:static; flex-direction:row; flex-wrap:wrap; align-items:center} .gbl-head .hh-open{margin-left:auto} }
@media (max-width:760px){ .gb-clist.two{grid-template-columns:1fr} .gb-jump{top:77px} .lj-head .assume{margin-left:0} }


.gb-tabs{margin:0 0 14px}
.tab-n{font-size:11.5px; font-weight:800; background:rgba(0,0,0,.08); border-radius:var(--r-full); padding:0 7px; margin-left:2px}
.seg a.on .tab-n{background:rgba(255,255,255,.2)}
.arch-year + .arch-year{margin-top:18px}
.arch-year h3{display:flex; align-items:center; gap:10px; font-size:15px; margin:2px 0 10px}

.snap{margin-top:20px; padding-top:20px; border-top:1px solid var(--border-soft); display:block}
.snap-main{gap:40px !important; padding:22px 28px !important}
.snap-cats{max-width:720px}
.snap-main{display:flex; gap:24px; align-items:center; background:var(--bg); border-radius:var(--r-2xl); padding:20px; flex-wrap:wrap}
.snap-ring{position:relative; width:150px; height:150px; flex:none}
.snap-ring svg{width:100%; height:100%}
.ring-arc{animation:ring 1s ease-out}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
.snap-ring-t{position:absolute; inset:0; display:grid; place-content:center; text-align:center}
.snap-ring-t b{font-family:var(--font-head); font-weight:600; font-size:34px; color:var(--primary-dark); line-height:1}
.snap-ring-t small{font-size:12px; font-weight:800; color:var(--text-3)}
.snap-cats{flex:1; min-width:220px; display:grid; gap:12px}
.snap-cats h3,.snap-chart h3{font-family:var(--font-body); font-weight:800; font-size:13px; color:var(--text-3)}
.snap-cat-h{display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:14px; font-weight:800}
.snap-cat-h span{display:inline-flex; align-items:center; gap:7px}
.snap-cat-h span i{width:10px; height:10px; border-radius:3px; display:inline-block}
.snap-cat-h em{font-style:normal; font-weight:600; font-size:12px; color:var(--text-3)}
.snap-cat-h b{font-family:var(--font-head); font-weight:600}
.snap-bar{display:block; height:10px; border-radius:5px; background:var(--white); margin-top:5px; overflow:hidden; border:1px solid var(--border-soft)}
.snap-bar i{display:block; height:100%; border-radius:5px; animation:grow .9s ease-out}
@keyframes grow{from{width:0}}
.snap-tiles{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.snap-tile{border-radius:var(--r-2xl); padding:14px 16px; display:flex; flex-direction:column; gap:2px; min-width:0}
.snap-tile span{width:32px; height:32px; border-radius:10px; background:rgba(255,255,255,.7); display:grid; place-items:center; margin-bottom:6px}
.snap-tile span svg.i{width:17px; height:17px}
.snap-tile b{font-family:var(--font-head); font-weight:600; font-size:22px; color:var(--text)}
.snap-tile small{font-size:12.5px; font-weight:700; color:var(--text-2); line-height:1.35}
.snap-chart{grid-column:1 / -1; background:var(--bg); border-radius:var(--r-2xl); padding:16px 20px}
.snap-cols{display:flex; align-items:flex-end; gap:10px; height:120px; margin-top:12px; padding-bottom:4px; border-bottom:1px solid var(--sand)}
.snap-col{flex:1; max-width:56px; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:4px}
.snap-col i{display:block; width:100%; border-radius:8px 8px 3px 3px; animation:rise .8s ease-out}
@keyframes rise{from{height:0}}
.snap-v{font-size:11.5px; font-weight:800; color:var(--text-2)}
.snap-legend{display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; font-size:12.5px; font-weight:700; color:var(--text-2)}
.snap-legend span{display:inline-flex; align-items:center; gap:6px}
.snap-legend i{width:10px; height:10px; border-radius:3px}
.home-hero.guide-hero{padding:28px 32px 30px; margin-bottom:22px}
.guide-hero h1{margin-top:10px}
.guide-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(340px,1fr)); gap:18px}
.guide-card{padding:22px}
.guide-ch{display:flex; gap:12px; align-items:center; margin-bottom:14px}
.guide-ch h2{font-size:18px}
.guide-ch small{color:var(--text-3); font-weight:700}
.guide-next{display:flex; gap:8px; align-items:center; background:var(--primary-wash); border-radius:var(--r-lg); padding:10px 12px; font-size:13.5px; margin-bottom:6px}
.guide-card h3{font-family:var(--font-body); font-weight:800; font-size:14px; margin-top:14px}
.guide-card p{color:var(--text-2); font-size:14px; margin-top:2px}
.guide-card .link-btn{display:inline-flex; gap:6px; align-items:center; margin-top:16px; text-align:left}
@media (max-width:1080px){ .snap{grid-template-columns:1fr} }
@media (max-width:620px){ .snap-ring{width:120px; height:120px} .snap-tiles{grid-template-columns:1fr 1fr} .snap-cols{gap:5px} }

.lj-hero{position:relative; background:var(--bg-medium); border-radius:var(--r-3xl); padding:34px 40px 30px; margin-bottom:18px; overflow:hidden}
.lj-hero .hero-art{opacity:.6}
.lj-hero{margin-bottom:22px}
.lj-hero-in{position:relative; display:flex; gap:26px; align-items:center; flex-wrap:wrap}
.lj-hero .lj-av{width:112px !important; height:112px !important; font-size:48px !important; box-shadow:0 0 0 6px #fff, var(--lift)}
.lj-hero-t{flex:1; min-width:260px; max-width:620px}
.lj-hero-t h1{font-size:32px; margin-top:8px; line-height:1.15}
.lj-hero-t p{color:var(--text-2); margin-top:6px; font-size:15.5px}
.lj-hero-acts{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px}
.lj-hero-acts .btn{height:46px; padding:0 24px}
.lj-hero-meta{position:absolute; right:22px; bottom:16px; font-size:12.5px; font-weight:800; color:var(--brown); background:rgba(255,255,255,.75); border-radius:var(--r-full); padding:4px 12px}
.lj-zone{background:var(--white); border:1px solid var(--border-soft); border-radius:var(--r-3xl); padding:26px 26px 28px}
.lj-zone-h{display:flex; gap:14px; align-items:flex-start; margin-bottom:18px}
.lj-zone-h .cat-ic{width:48px; height:48px; border-radius:14px}
.lj-zone-h h2{font-size:24px}
.lj-zone-h p{color:var(--text-2); font-size:14.5px; margin-top:2px; max-width:80ch}
.lj-zone .lj-tabs{margin-bottom:0}
.lj-subject{background:transparent; border-radius:0 0 var(--r-2xl) var(--r-2xl); padding:16px 18px 18px}
.lj-subject .lj-legend{margin:2px 0 14px}
.lj-eguide{margin-top:18px; border:1.5px solid var(--primary-light); border-radius:var(--r-2xl); background:var(--white); overflow:hidden}
.lj-eg-h{display:flex; gap:14px; align-items:center; width:100%; background:var(--primary-wash); border:0; padding:14px 18px; text-align:left}
.lj-eg-h .cat-ic{width:44px; height:44px}
.lj-eg-h small{display:block; font-weight:700; font-size:12.5px; color:var(--text-2)}
.lj-eg-h b{font-family:var(--font-head); font-weight:600; font-size:18px; color:var(--brown)}
.lj-eg-h .go{margin-left:auto; width:30px; height:30px; border-radius:50%; background:var(--primary-subtle); color:var(--primary); display:grid; place-items:center}
.lj-eg-body{padding:16px 18px 18px}
.lj-eg-tips{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; padding-bottom:16px; border-bottom:1px solid var(--border-soft)}
.lj-eg-tips h4{font-family:var(--font-body); font-weight:800; font-size:14px}
.lj-eg-tips p{color:var(--text-2); font-size:13.5px; margin-top:2px}
.lj-eg-cats{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:12px; margin-top:16px}
.lj-eg-cat{background:var(--bg); border-radius:var(--r-xl); padding:12px 14px}
.lj-eg-cat p{display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:13px; color:var(--text-2)}

.lj-crow .chev{color:var(--text-3)}
.lj-groups{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px; padding:4px 22px 22px; border-top:1px solid var(--border-soft); padding-top:18px}
.lj-group{background:var(--bg); border-radius:var(--r-xl); padding:12px}
.lj-group h4{display:flex; align-items:center; gap:8px; font-family:var(--font-body); font-weight:800; font-size:14px; margin:2px 4px 10px}

.lj-none{font-size:13px; color:var(--text-3); padding:4px 6px 8px}
.lj-ms{background:var(--white); border:1px solid var(--border-soft); border-radius:var(--r-lg); margin-bottom:8px; overflow:hidden}
.lj-ms.open{border-color:var(--primary-light); box-shadow:0 6px 16px -10px rgba(77,26,114,.35)}
.lj-msrow{display:flex; align-items:center; gap:10px; width:100%; background:none; border:0; padding:10px 12px; text-align:left}
.lj-msrow:hover{background:var(--primary-wash)}
.lj-msrow > span:nth-child(2){flex:1}
.lj-msrow b{display:block; font-size:14px; font-weight:800}
.lj-msrow small{font-size:12px; color:var(--text-3)}
.lj-msrow .chev{color:var(--text-3)}
.lj-msbody{padding:4px 14px 16px; border-top:1px solid var(--border-soft)}
.lj-mark{margin-top:12px; background:var(--primary-wash); border-radius:var(--r-lg); padding:12px}
.lj-mark-h{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; font-size:13.5px}
.lj-mark-h .muted{font-size:12px}
.lj-mopts{display:grid; grid-template-columns:repeat(2,1fr); gap:6px; margin-top:10px}
.lj-mopt{display:flex; align-items:center; gap:7px; border:1.5px solid var(--border-soft); background:var(--white); border-radius:var(--r-lg); padding:8px 10px; font-size:13px; font-weight:800; color:var(--text-2)}
.lj-mopt:hover{border-color:var(--primary-light)}
.lj-mopt.on{color:var(--text); border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-subtle)}
.lj-online{display:flex; gap:6px; align-items:flex-start; font-size:12.5px; color:var(--text-2); margin-top:10px}
.lj-online svg.i{width:15px; height:15px; margin-top:1px; flex:none}
.lj-msbody h5{font-family:var(--font-body); font-weight:800; font-size:13px; color:var(--text-3); margin:14px 0 6px}
.lj-skills{list-style:none; margin:0; padding:0; counter-reset:sk}
.lj-skills li{counter-increment:sk; display:flex; gap:10px; align-items:center; justify-content:space-between; padding:8px 0; border-top:1px solid var(--border-soft); font-size:13.5px; font-weight:700}
.lj-skills li:first-child{border-top:0}
.lj-skills li > span:first-child::before{content:counter(sk) ". "; color:var(--text-3)}
.sk{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:800; padding:3px 9px 3px 6px; border-radius:var(--r-full); white-space:nowrap}
.sk svg.i{width:14px; height:14px}
.sk-done{background:var(--green-subtle); color:var(--green-dark)}
.sk-prog{background:var(--yellow-subtle); color:#7A5200}
.sk-todo{background:var(--white); color:var(--text-2); border:1px solid var(--border)}
.lens-note{display:flex; gap:14px; align-items:flex-start; margin-top:22px; background:var(--white); border:1px dashed var(--sand-dark); border-radius:var(--r-2xl); padding:16px 18px; font-size:14px; color:var(--text-2)}
.lens-note b{color:var(--text)}
.lens-note > div > b:first-child{display:block; margin-bottom:2px}
.lens-note svg.i{color:var(--primary); margin-top:2px}
.lens-note.small{margin:0 0 16px}
.lens-note.small > div > b:first-child{display:inline; margin:0}
.lesson-sep{border-top:1px solid var(--border-soft); margin:0 40px}
.ms-prompt{margin-top:14px; background:var(--yellow-subtle); border:1px solid var(--yellow-lighter); border-radius:var(--r-xl); padding:14px 16px; max-width:460px}
.ms-ph{display:flex; flex-direction:column; gap:6px; align-items:flex-start}
.ms-ph b{font-size:15.5px}
.ms-steps{list-style:none; padding:0; margin:10px 0 14px; display:grid; gap:6px; font-size:14px}
.ms-steps li{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.ms-steps .n{width:22px; height:22px; border-radius:50%; background:#fff; border:1px solid var(--yellow-hover); display:grid; place-items:center; font-size:12px; font-weight:800; flex:none}
.ms-done{display:flex; gap:8px; align-items:center; margin-top:12px; font-size:14px; color:var(--text-2)}
@media (max-width:1080px){ .lj-snap{grid-template-columns:1fr 1fr} .lj-guide{grid-column:1 / -1} .lj-groups{grid-template-columns:1fr} }
@media (max-width:760px){
  .lj-links{grid-template-columns:1fr}
  .lj-av{width:60px !important; height:60px !important; font-size:26px !important}
  .lj-snap{grid-template-columns:1fr}
  .lj-badges{width:100%; gap:6px}
  .lj-badge{flex:1; min-width:0; padding:7px 8px; gap:6px; font-size:15px; justify-content:center}
  .lj-crow .chev{display:none}
  .lj-tabs a{padding:10px 16px}
  .lj-prog{padding:20px 14px}
  .lj-groups{padding:14px 12px 16px}
  .lesson-sep{margin:0 22px}
}

/* ===================== GRADEBOOK ===================== */
.hh-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:18px}

.hh-none{display:flex; gap:10px; align-items:center; margin:0 20px 20px; padding:14px 16px; border-radius:var(--r-xl); background:var(--bg); color:var(--text-2); font-weight:700; font-size:14px; border-top:1px solid var(--border-soft)}

.gb-head{display:flex; gap:20px; align-items:center; padding:8px 0 24px; flex-wrap:wrap}

.kid-info span{font-size:13px; color:var(--text-2); font-weight:700}
.kid-go{margin-top:auto; display:inline-flex; gap:6px; align-items:center; color:var(--primary); font-weight:800}
.star{width:20px; height:20px; fill:var(--white); stroke:var(--sand-base); stroke-width:1.6; stroke-linejoin:round}
.star.on{fill:var(--yellow); stroke:var(--yellow-hover)}
.star.big{width:28px; height:28px}
.stars{display:inline-flex; gap:2px}
.kid-chead{display:flex; gap:18px; align-items:center; padding:22px 24px; margin-bottom:22px; flex-wrap:wrap}
.kid-chead > div:not(.kid-info):not(.gb-grade){flex:1}
.kid-chead h1{font-size:26px}
.kid-chead p{color:var(--text-2); font-weight:700}
.kid-chead .cat-ic{width:64px; height:64px}
.kid-chead .cat-ic svg.i{width:32px; height:32px}
.kid-unit{margin-bottom:24px}
.kid-unit h2{font-size:19px; margin-bottom:12px}
.kid-lesson{background:var(--white); border:2px solid var(--border-soft); border-radius:var(--r-2xl); padding:16px 18px; margin-bottom:10px}
.kid-lesson.st-complete{border-color:#AAE7CE}
.kid-lhead{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.kid-lhead b{font-size:17px}
.kid-lesson .st{font-size:14px; padding:6px 12px 6px 9px}
.kid-items{display:grid; gap:8px; margin-top:12px}
.kid-item{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--r-xl); background:var(--bg); text-decoration:none; color:inherit; font-weight:700; flex-wrap:wrap}
.kid-item > span:first-child{flex:1; min-width:140px}
a.kid-item:hover{background:var(--primary-wash)}
.kid-item b{font-family:var(--font-head); font-size:17px; color:var(--primary-dark)}
.kid-score{display:flex; flex-direction:column; align-items:flex-end; gap:6px}
.kid-score b{font-family:var(--font-head); font-size:20px}
.gb-q.kid .gb-qtext{font-size:20px}
.gb-q.kid .gb-qn{display:grid; place-items:center; width:32px; height:32px; border-radius:50%; background:var(--primary-subtle); color:var(--primary-dark); font-size:15px}
.gb-q.kid .gb-visual{font-size:40px}
.gb-q.kid .gb-cols{grid-template-columns:1fr}
.gb-q.kid .gb-resp{font-size:18px}
.redo-panel{padding:20px 22px; margin-bottom:18px; border:2px solid var(--yellow-lighter)}
.redo-panel h2{display:flex; gap:10px; align-items:center; font-size:18px; margin-bottom:12px}
.redo-card{display:flex; gap:16px; align-items:center; padding:14px; border-radius:var(--r-2xl); background:var(--yellow-subtle); flex-wrap:wrap}
.redo-card + .redo-card{margin-top:10px}
.redo-card > div{flex:1; min-width:180px}
.redo-card h3{font-size:18px; margin-top:6px}
.redo-card p{color:var(--text-2); font-size:14px}
.redo-card .cat-ic{width:52px; height:52px}
.redo-head{display:flex; gap:16px; align-items:center; padding:22px 24px; margin-bottom:18px}
.redo-head h1{font-size:24px}
.redo-head p{color:var(--text-2); margin-top:4px}
.redo-head .cat-ic{width:56px; height:56px}
.redo-item{margin-bottom:18px}
.redo-item h2{font-size:18px; margin-bottom:10px}
.redo-item .gb-q{margin-bottom:12px}
.choices{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px}
.choice{min-width:72px; min-height:56px; padding:10px 18px; border-radius:var(--r-2xl); border:2px solid var(--border); background:var(--white); font-size:20px; font-weight:800}
.choice:hover{border-color:var(--primary-light)}
.choice.on{border-color:var(--primary); background:var(--primary-wash); color:var(--primary-dark); box-shadow:0 0 0 3px var(--primary-subtle)}
.redo-actions{display:flex; justify-content:flex-end; gap:12px; margin-top:10px}
.redo-go{height:56px; font-size:18px; padding:0 30px}
.kid-modal{text-align:center}
.kid-burst{font-size:56px}
.proto-seg{display:flex; gap:4px; margin-top:6px; width:100%}
.proto-seg button{flex:1; border:1px solid var(--border-soft); background:var(--bg); border-radius:var(--r-md); padding:6px 4px; font-size:11.5px; font-weight:700}
.proto-seg button.on{background:#333; color:#fff; border-color:#333}
@media (max-width:760px){
  .gb-av{width:56px !important; height:56px !important; font-size:24px !important}
  .gb-title h1{font-size:23px}
  .gb-course{flex-wrap:wrap; padding:16px}
  .gb-course .gb-grade,.gb-course .gb-prog{text-align:left; min-width:0; flex-basis:100%; padding-left:70px}
  .gb-course .chev{display:none}
  .gb-head-tags{align-items:flex-start}
  .gb-lessons{padding:4px 12px 14px}
  .gb-item{padding:12px 14px}
  .gb-score{text-align:left}
  .gb-cols{grid-template-columns:1fr}
  .gb-grade.lg b{font-size:32px}
  .gb-ahead .gb-grade,.gb-chead-top .gb-grade{text-align:left}
}

/* ---------- Topic tiles ---------- */
.topics{display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-top:64px}
.topic{display:flex; flex-direction:column; align-items:center; text-align:center; gap:4px; background:var(--white); border:1px solid var(--border-soft); border-radius:var(--r-2xl); padding:18px 12px 16px; text-decoration:none; color:inherit; transition:border-color .15s}
.topic:hover{border-color:var(--primary-light)}
.topic .cat-ic{width:44px; height:44px; margin-bottom:6px}
.topic h3{font-size:15px}
.topic p{font-size:12.5px; color:var(--text-2); line-height:1.35}

/* ---------- Community + most-read ---------- */
.combo{display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); overflow:hidden}
.forum-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; padding:22px 24px 16px; flex-wrap:wrap}
.forum-head h2{font-size:19px}
.forum-head p{color:var(--text-2); font-size:13.5px; margin-top:2px}
.forum-actions{display:flex; gap:14px; align-items:center}
.fcols,.frow{display:grid; grid-template-columns:minmax(0,1fr) 64px 190px; gap:16px; align-items:center; padding:0 24px}
.fcols{background:var(--bg); border-top:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft); padding-top:8px; padding-bottom:8px; font-size:12px; font-weight:800; color:var(--text-3)}
.fcols span:nth-child(2){text-align:center}
.frow{padding-top:14px; padding-bottom:14px; border-bottom:1px solid var(--border-soft); text-decoration:none; color:inherit}
.frow:last-child{border-bottom:0}
.frow:hover{background:var(--bg)}
.frow.pinned{background:var(--primary-wash)}
.ft{display:flex; gap:12px; align-items:flex-start; min-width:0}
.ftitle{display:block; font-weight:800; font-size:14.5px; line-height:1.35}
.pin-ic{display:inline-flex; vertical-align:-3px; margin-right:5px; color:var(--primary)}
.pin-ic svg.i{width:15px; height:15px}
.frow .byline{margin-top:5px}
.frow .byline .fname{color:var(--text); font-weight:700}
.fnum{text-align:center; font-family:var(--font-head); font-size:17px}
.fnum.zero{color:var(--text-3)}
.flast{display:flex; gap:8px; align-items:center; min-width:0; font-size:12.5px}
.flast b{display:block; font-size:13px}
.flast small{color:var(--text-3)}
.mostread{border-left:1px solid var(--border-soft); padding:22px 24px; background:var(--white)}
.mostread h2{font-size:17px; margin-bottom:8px}
.mostread ol{list-style:none; counter-reset:mr; margin:0 0 16px; padding:0}
.mostread li{counter-increment:mr; border-top:1px solid var(--border-soft)}
.mostread li:first-child{border-top:0}
.mostread li a{display:grid; grid-template-columns:26px 1fr; padding:11px 0; text-decoration:none; color:inherit}
.mostread li a::before{content:counter(mr); grid-row:span 2; font-family:var(--font-head); font-weight:600; font-size:16px; color:var(--sand-dark)}
.mostread li a:hover b{color:var(--primary)}
.mostread b{font-size:14px; line-height:1.35}
.mostread small{font-size:12px; color:var(--text-3)}

/* ---------- Articles page (single container) ---------- */
.articles-box{overflow:hidden}
.arts-head{display:flex; gap:24px; align-items:center; justify-content:space-between; padding:28px 28px 20px; flex-wrap:wrap}
.arts-head h1{font-size:24px}
.arts-head p{color:var(--text-2); font-size:14px; margin-top:2px}
.arts-head .searchbar.inline{flex:1; max-width:520px; min-width:260px}
.filter-row{display:flex; flex-wrap:wrap; gap:8px; padding:0 28px 20px}
.fpill{display:inline-flex; align-items:center; gap:7px; white-space:nowrap; padding:8px 14px; border-radius:var(--r-full); border:1px solid var(--border-soft); background:var(--white); color:var(--text-2); font-size:13.5px; font-weight:700; text-decoration:none}
.fpill svg.i{width:15px; height:15px}
.fpill span{font-size:11.5px; color:var(--text-3); background:var(--bg-medium); border-radius:var(--r-full); padding:0 7px}
.fpill:hover{border-color:var(--primary-light); color:var(--primary-dark)}
.fpill.on{background:#333; border-color:#333; color:#fff}
.fpill.on span{background:rgba(255,255,255,.18); color:#fff}
.arts-body{border-top:1px solid var(--border-soft)}
.arts-body .result-meta{margin:0; padding:14px 28px; background:var(--bg); border-bottom:1px solid var(--border-soft)}
.arts-body .alist{border:0; border-radius:0}
.arts-body .aitem{padding:18px 28px}
.arts-body .empty{border:0; margin:0; border-radius:0}
.arts-body > .help{padding:14px 28px 20px; margin:0 !important; border-top:1px solid var(--border-soft)}

/* ---------- Videos ---------- */
.videos{display:grid; grid-template-columns:1.35fr 1fr; gap:20px}
.videos .stack{display:grid; gap:20px}
.vcard{display:flex; flex-direction:column; background:var(--white); border:1px solid var(--border-soft); border-radius:var(--r-2xl); overflow:hidden; text-decoration:none; color:inherit; transition:border-color .15s}
.vcard:hover{border-color:var(--primary-light)}
.vcard.row{flex-direction:row}
.thumb{position:relative; aspect-ratio:16/9; display:grid; place-items:center; overflow:hidden}
.vcard.row .thumb{width:46%; aspect-ratio:auto; min-height:150px; flex:none}
.thumb svg.art{position:absolute; inset:0; width:100%; height:100%}
.play{position:relative; width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,.92); display:grid; place-items:center; color:var(--primary); box-shadow:0 6px 16px -6px rgba(0,0,0,.35)}
.play svg.i{width:22px; height:22px; fill:currentColor; stroke:none; margin-left:3px}
.vcard.row .play{width:44px; height:44px}
.dur{position:absolute; right:10px; bottom:10px; background:rgba(38,38,38,.82); color:#fff; font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:var(--r-md)}
.vbody{padding:18px 20px 20px}
.vbody h3{font-size:17px; line-height:1.3}
.vcard.big .vbody h3{font-size:20px}
.vbody p{color:var(--text-2); font-size:13.5px; margin-top:6px}
.vbody .chip{margin-bottom:10px}

/* ---------- Categories ---------- */
.cats{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
.cat{display:flex; gap:16px; align-items:flex-start; text-align:left; background:var(--white); border:1px solid var(--border-soft); border-radius:var(--r-2xl); padding:20px; text-decoration:none; color:inherit; transition:border-color .15s}
.cat:hover{border-color:var(--primary-light)}
.cat-ic{width:46px; height:46px; border-radius:var(--r-xl); display:grid; place-items:center; flex:none}
.cat-ic svg.i{width:22px; height:22px}
.cat h3{font-size:15.5px; font-weight:600}
.cat p{color:var(--text-2); font-size:13px; margin-top:3px}
.cat .count{font-size:12px; color:var(--text-3); margin-top:8px; font-weight:700}
.t-purple{background:var(--primary-subtle); color:var(--primary-dark)}
.t-teal{background:var(--teal-subtle); color:var(--teal-dark)}
.t-coral{background:var(--coral-subtle); color:var(--coral-dark)}
.t-green{background:var(--green-subtle); color:var(--green-dark)}
.t-yellow{background:var(--yellow-subtle); color:#8A5A00}
.t-pink{background:var(--pink-subtle); color:#B4505A}

/* ---------- Two column ---------- */
.split{display:grid; grid-template-columns:1fr; gap:20px}
.list-panel{padding:8px 0}
.list-panel h2{font-size:18px; padding:18px 24px 6px}
.arow{display:flex; gap:14px; align-items:center; padding:14px 24px; text-decoration:none; color:inherit; border-top:1px solid var(--border-soft)}
.arow:first-of-type{border-top:0}
.arow:hover{background:var(--bg)}
.arow .doc{width:36px; height:36px; border-radius:var(--r-lg); background:var(--bg-medium); color:var(--brown); display:grid; place-items:center; flex:none}
.arow .doc svg.i{width:18px; height:18px}
.arow b{font-weight:700; font-size:14.5px; display:block}
.arow small{color:var(--text-3); font-size:12.5px}
.arow .chev{margin-left:auto; color:var(--text-3)}
.ask-cta{margin:12px 24px 16px; padding:18px; border-radius:var(--r-2xl); background:var(--teal-subtle); display:flex; gap:14px; align-items:center; flex-wrap:wrap}
.ask-cta p{flex:1; min-width:180px; font-size:14px; color:var(--teal-dark)}
.ask-cta b{display:block; color:var(--text); font-size:15px}

/* ---------- Articles page ---------- */
.two-col{display:grid; grid-template-columns:240px 1fr; gap:28px; align-items:start}
.cat-nav{position:sticky; top:100px; display:flex; flex-direction:column; gap:4px}
.cat-nav h3{font-size:14px; padding:0 12px 8px}
.cat-nav a{display:flex; justify-content:space-between; gap:8px; padding:9px 12px; border-radius:var(--r-lg); font-size:13.5px; color:var(--text); text-decoration:none}
.cat-nav a:hover{background:var(--white)}
.cat-nav a.on{background:#F2EEF7; color:var(--primary-dark); font-weight:700}
.cat-nav a span{color:var(--text-3); font-size:12px}
.searchbar.inline{transform:none; margin:0; max-width:none; box-shadow:none; border-color:var(--border); padding:6px 6px 6px 18px}
.searchbar.inline input{font-size:15px; padding:8px 0}
.result-meta{margin:22px 0 12px; color:var(--text-2); font-size:14px}
.result-meta b{color:var(--text)}
.group{margin-top:26px}
.group h3{font-size:16px; margin-bottom:10px; display:flex; align-items:center; gap:10px}
.group h3 .cat-ic{width:30px; height:30px; border-radius:var(--r-lg)}
.group h3 .cat-ic svg.i{width:16px; height:16px}
.alist{background:var(--white); border:1px solid var(--border-soft); border-radius:var(--r-2xl); overflow:hidden}
.aitem{display:flex; gap:16px; padding:16px 20px; text-decoration:none; color:inherit; border-top:1px solid var(--border-soft); align-items:flex-start}
.aitem:first-child{border-top:0}
.aitem:hover{background:var(--bg)}
.aitem h4{font-size:15px; font-weight:600; font-family:var(--font-body); font-weight:800}
.aitem p{color:var(--text-2); font-size:13.5px; margin-top:3px}
.aitem .tags{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}
.aitem mark{background:var(--yellow-lighter); color:inherit; border-radius:3px; padding:0 2px}
.aitem .chev{margin-left:auto; color:var(--text-3); align-self:center}

.empty{text-align:center; padding:56px 24px; background:var(--white); border:1px solid var(--border-soft); border-radius:var(--r-3xl); margin-top:18px}
.empty .art{width:120px; height:96px; margin:0 auto 18px; display:block}
.empty h3{font-size:20px}
.empty p{color:var(--text-2); max-width:440px; margin:8px auto 0}
.empty .actions{display:flex; gap:10px; justify-content:center; margin-top:22px; flex-wrap:wrap}

/* ---------- Article ---------- */
.article-wrap{display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:28px; align-items:start}
.article{padding:36px 40px 40px}
.back{display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:700; color:var(--primary); text-decoration:none; margin-bottom:16px}
.back svg.i{width:16px; height:16px}
.article h1{font-size:30px; line-height:1.2; margin-top:12px; max-width:22ch}
.article .meta{display:flex; gap:16px; color:var(--text-3); font-size:13px; margin-top:10px; flex-wrap:wrap}
.article .meta span{display:inline-flex; gap:6px; align-items:center}
.article .meta svg.i{width:15px; height:15px}
.player{margin-top:26px; border-radius:var(--r-2xl); overflow:hidden; position:relative; aspect-ratio:16/9; display:grid; place-items:center; border:1px solid var(--border-soft)}
.player svg.art{position:absolute; inset:0; width:100%; height:100%}
.player .play{width:72px; height:72px; border:0}
.player .play svg.i{width:28px; height:28px}
.player-bar{position:absolute; left:0; right:0; bottom:0; padding:12px 16px; display:flex; gap:12px; align-items:center; background:linear-gradient(transparent, rgba(38,38,38,.7)); color:#fff; font-size:12.5px; font-weight:700}
.track{flex:1; height:4px; border-radius:2px; background:rgba(255,255,255,.35); overflow:hidden}
.track i{display:block; height:100%; width:0; background:#fff}
.player.playing .track i{animation:prog 9s linear forwards}
@keyframes prog{to{width:100%}}
.player .note{position:absolute; top:14px; left:14px; background:rgba(255,255,255,.92); font-size:12px; font-weight:700; padding:4px 10px; border-radius:var(--r-full); color:var(--text-2)}
.prose{margin-top:28px; max-width:68ch; font-size:16px; line-height:1.65}
.prose p{margin-bottom:14px}
.prose h2{font-size:19px; margin:26px 0 12px}
.steps{list-style:none; padding:0; margin:0; counter-reset:s}
.steps li{counter-increment:s; position:relative; padding:0 0 18px 48px}
.steps li::before{content:counter(s); position:absolute; left:0; top:-2px; width:30px; height:30px; border-radius:50%; background:var(--primary-subtle); color:var(--primary-dark); font-family:var(--font-head); font-weight:600; font-size:14px; display:grid; place-items:center}
.tip{display:flex; gap:12px; background:var(--yellow-subtle); border-radius:var(--r-xl); padding:14px 16px; font-size:14.5px; margin-top:8px}
.tip svg.i{color:#8A5A00; margin-top:2px}
.helpful{margin-top:34px; padding-top:22px; border-top:1px solid var(--border-soft); display:flex; align-items:center; gap:12px; flex-wrap:wrap; font-weight:700; font-size:14.5px}
.side-card{padding:22px}
.side-card h3{font-size:15px; margin-bottom:10px}
.side-card + .side-card{margin-top:16px}
.side-card a.rel{display:block; padding:9px 0; border-top:1px solid var(--border-soft); color:var(--text); text-decoration:none; font-size:14px; font-weight:700}
.side-card a.rel:hover{color:var(--primary)}
.side-card p{font-size:13.5px; color:var(--text-2); margin-bottom:14px}

/* ---------- Community ---------- */
.comm-head{display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin-top:8px}
.comm-head h1{font-size:26px}
.comm-head p{color:var(--text-2); font-size:14.5px; margin-top:4px; max-width:58ch}
.filters{display:flex; gap:8px; margin:22px 0 14px; flex-wrap:wrap; align-items:center}
.filter{border:1px solid var(--border-soft); background:var(--white); border-radius:var(--r-full); padding:6px 14px; font-size:13px; font-weight:700; color:var(--text-2)}
.filter.on{border-color:var(--primary); color:var(--primary-dark); background:var(--primary-wash)}
.pinned-box{background:var(--white); border:1.5px solid var(--primary-lighter); border-radius:var(--r-2xl); overflow:hidden; margin-bottom:16px}
.pinned-head{display:flex; align-items:center; gap:8px; padding:12px 20px; background:var(--primary-wash); font-size:13px; font-weight:800; color:var(--primary-dark)}
.pinned-head svg.i{width:16px; height:16px}
.pinned-head .order{margin-left:auto; font-weight:600; color:var(--text-2); display:flex; gap:8px; align-items:center}
.post-row{display:flex; gap:14px; padding:16px 20px; border-top:1px solid var(--border-soft); text-decoration:none; color:inherit; align-items:flex-start}
.pinned-box .post-row:first-of-type{border-top:0}
.post-row:hover{background:var(--bg)}
.av{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:800; font-size:14px; flex:none}
.av.sm{width:30px; height:30px; font-size:12px}
.av.staff{background:var(--primary-darker)}
.post-row .body{flex:1; min-width:0}
.post-row h3{font-family:var(--font-body); font-weight:800; font-size:15.5px; line-height:1.35}
.post-row .excerpt{color:var(--text-2); font-size:13.5px; margin-top:3px; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden}
.byline{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:8px; font-size:12.5px; color:var(--text-3)}
.byline b{color:var(--text); font-weight:700}
.stats{display:flex; gap:16px; align-items:center; color:var(--text-2); font-size:13px; font-weight:700; flex:none; padding-top:2px}
.stats span{display:inline-flex; gap:5px; align-items:center}
.stats svg.i{width:16px; height:16px}
.stats .zero{color:var(--text-3)}
.feed{background:var(--white); border:1px solid var(--border-soft); border-radius:var(--r-2xl); overflow:hidden}
.feed .post-row:first-child{border-top:0}
.mod-tools{display:flex; gap:4px; align-items:center; flex:none}
.mini{width:30px; height:30px; border-radius:var(--r-md); border:1px solid var(--border-soft); background:var(--white); display:grid; place-items:center; color:var(--text-2)}
.mini:hover:not(:disabled){border-color:var(--primary-light); color:var(--primary)}
.mini:disabled{opacity:.35; cursor:default}
.mini svg.i{width:15px; height:15px}

/* badges */
.badge-staff{white-space:nowrap; display:inline-flex; align-items:center; gap:0; border-radius:var(--r-md); overflow:hidden; font-size:11px; font-weight:800; line-height:1; border:1px solid var(--primary-darker)}
.badge-staff .org{background:var(--primary-darker); color:#fff; padding:4px 7px; display:inline-flex; gap:4px; align-items:center}
.badge-staff .org svg{width:11px; height:11px}
.badge-staff .role{background:var(--white); color:var(--primary-darker); padding:4px 7px}
.badge-founder{display:inline-flex; align-items:center; gap:4px; background:var(--yellow-subtle); color:#6B4A00; border:1px solid var(--yellow-lighter); border-radius:var(--r-full); font-size:11px; font-weight:800; padding:2px 8px 2px 6px}
.badge-founder svg.i{width:12px; height:12px; fill:var(--yellow); stroke:var(--yellow-hover)}

/* thread */
.thread{display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:28px; align-items:start}
.op{padding:30px 32px}
.op h1{font-size:25px; line-height:1.3}
.author{display:flex; align-items:center; gap:12px; margin-top:16px}
.author .who-line{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.author b{font-weight:800}
.author small{display:block; color:var(--text-3); font-size:12.5px}
.post-text{font-size:15.5px; line-height:1.65; margin-top:18px; white-space:pre-wrap; max-width:68ch}
.op-actions{display:flex; align-items:center; gap:10px; margin-top:20px; flex-wrap:wrap}
.op-top{display:flex; gap:12px; align-items:flex-start; justify-content:space-between}
.reply{display:flex; gap:14px; padding:22px 24px; border-top:1px solid var(--border-soft)}
.reply:first-child{border-top:0; border-top-left-radius:var(--r-3xl); border-top-right-radius:var(--r-3xl)}
.reply:last-child{border-bottom-left-radius:var(--r-3xl); border-bottom-right-radius:var(--r-3xl)}
.reply.staff{background:linear-gradient(90deg, var(--primary-wash), var(--white) 70%); border-left:4px solid var(--primary-darker)}
.reply .rb{flex:1; min-width:0}
.reply .post-text{font-size:15px; margin-top:8px}
.replies-head{display:flex; align-items:center; justify-content:space-between; margin:30px 0 12px}
.replies-head h2{font-size:18px}
.waiting{display:flex; gap:18px; align-items:center; padding:26px 28px; background:var(--white); border:1.5px dashed var(--sand-base); border-radius:var(--r-2xl)}
.waiting .clock{width:56px; height:56px; border-radius:50%; background:var(--teal-subtle); color:var(--teal-dark); display:grid; place-items:center; flex:none}
.waiting .clock svg.i{width:28px; height:28px}
.waiting h3{font-size:17px}
.waiting p{color:var(--text-2); font-size:14px; margin-top:4px}
.status-line{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}

/* reactions */
.reactions{display:flex; gap:6px; flex-wrap:wrap; align-items:center; position:relative; margin-top:14px}
.rx{display:inline-flex; align-items:center; gap:5px; height:30px; padding:0 10px; border-radius:var(--r-full); border:1px solid var(--border-soft); background:var(--white); font-size:13px; font-weight:800; color:var(--text-2)}
.rx:hover{border-color:var(--border-hover)}
.rx.mine{border-color:var(--primary); background:var(--primary-wash); color:var(--primary-dark)}
.rx .e{font-size:15px; line-height:1}
.rx-add{width:30px; padding:0; justify-content:center}
.rx-add svg.i{width:16px; height:16px}
.pop{position:absolute; z-index:40; background:var(--white); border:1px solid var(--border-soft); border-radius:var(--r-xl); box-shadow:0 18px 40px -16px rgba(46,31,28,.35); padding:6px}
.rx-pop{top:36px; left:0; display:flex; gap:2px}
.rx-pop button{border:0; background:none; border-radius:var(--r-lg); padding:6px 8px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; font-weight:700; color:var(--text-2)}
.rx-pop button .e{font-size:20px}
.rx-pop button:hover,.rx-pop button.mine{background:var(--primary-wash)}
.menu-pop{right:0; top:40px; min-width:250px}
.menu-pop button{display:flex; width:100%; gap:10px; align-items:center; border:0; background:none; padding:10px 12px; border-radius:var(--r-lg); font-size:14px; text-align:left}
.menu-pop button:hover{background:var(--bg)}
.menu-pop button.danger{color:var(--error-dark)}
.menu-pop hr{border:0; border-top:1px solid var(--border-soft); margin:4px 0}
.menu-pop .lbl{font-size:11.5px; font-weight:800; color:var(--text-3); padding:6px 12px 2px}
.rel-wrap{position:relative}
.mod-chip-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}

/* composer */
.composer{background:var(--white); border:1px solid var(--border-soft); border-radius:var(--r-2xl); padding:22px}
.field{margin-bottom:16px}
.field label{display:block; font-weight:800; font-size:14px; margin-bottom:6px}
.field label .opt{font-weight:600; color:var(--text-3)}
.input{width:100%; border:1.5px solid var(--bg-medium); background:var(--bg-medium); border-radius:var(--r-xl); padding:12px 14px; font-size:15px; outline:0; transition:border-color .15s, background .15s}
.input:hover{background:var(--bg); border-color:var(--sand-base)}
.input:focus{background:var(--white); border-color:#9E6D58}
.input.err{border-color:var(--error); background:var(--white)}
textarea.input{min-height:140px; resize:vertical; line-height:1.55}
.reply-composer textarea.input{min-height:96px}
.msg-err{display:flex; gap:6px; align-items:flex-start; color:var(--error); font-size:13px; font-weight:700; margin-top:6px}
.msg-err svg.i{width:16px; height:16px; margin-top:1px}
.help{font-size:12.5px; color:var(--text-3); margin-top:6px}
.toolbar{display:flex; align-items:center; gap:6px; flex-wrap:wrap; border-top:1px solid var(--border-soft); padding-top:14px; margin-top:4px}
.tool{display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 12px; border-radius:var(--r-full); border:1px solid var(--border-soft); background:var(--white); font-size:13px; font-weight:700; color:var(--text-2)}
.tool:hover,.tool.on{border-color:var(--primary-light); color:var(--primary-dark); background:var(--primary-wash)}
.tool svg.i{width:16px; height:16px}
.toolbar .submit{margin-left:auto}
.subpanel{border:1px solid var(--border-soft); background:var(--bg); border-radius:var(--r-xl); padding:14px; margin:12px 0}
.subpanel .row{display:flex; gap:8px; flex-wrap:wrap}
.subpanel .row .input{flex:1; min-width:200px; background:var(--white); border-color:var(--border)}
.gif-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-top:10px}
.gif-tile{position:relative; border:0; border-radius:var(--r-lg); aspect-ratio:4/3; display:grid; place-items:center; overflow:hidden; padding:0}
.gif-tile .e{font-size:26px; animation:bob 1.2s ease-in-out infinite}
.gif-tile .l{position:absolute; bottom:4px; left:0; right:0; font-size:10.5px; font-weight:800; color:var(--brown)}
@keyframes bob{50%{transform:translateY(-4px) rotate(-6deg)}}
.g1,.att.g1{background:var(--yellow-lighter)} .g2,.att.g2{background:var(--green-subtle)} .g3,.att.g3{background:var(--coral-lighter)} .g4,.att.g4{background:var(--primary-subtle)} .g5,.att.g5{background:var(--teal-subtle)} .g6,.att.g6{background:var(--pink-subtle)}
.rec{display:flex; align-items:center; gap:12px; font-weight:700; font-size:14px}
.rec .dot{width:12px; height:12px; border-radius:50%; background:var(--error); animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.atts{display:flex; flex-direction:column; gap:10px; margin:12px 0}
.att{position:relative; display:flex; align-items:center; gap:12px; border:1px solid var(--border-soft); background:var(--white); border-radius:var(--r-xl); padding:10px 12px; max-width:520px; text-decoration:none; color:inherit}
.att .x{position:absolute; top:-8px; right:-8px; width:24px; height:24px; border-radius:50%; background:var(--text); color:#fff; border:2px solid var(--white); display:grid; place-items:center; padding:0}
.att .x svg.i{width:12px; height:12px; stroke-width:2.4}
.att-video .vt{width:120px; aspect-ratio:16/9; border-radius:var(--r-lg); background:var(--teal-subtle); display:grid; place-items:center; color:var(--teal-dark); flex:none}
.att-video .vt svg.i{fill:currentColor; stroke:none}
.att b{display:block; font-size:14px; font-weight:800}
.att span.s{font-size:12.5px; color:var(--text-3)}
.att-audio .ap{width:36px; height:36px; border-radius:50%; background:var(--primary); color:#fff; border:0; display:grid; place-items:center; flex:none}
.att-audio .ap svg.i{fill:currentColor; stroke:none; width:15px; height:15px; margin-left:2px}
.wave{display:flex; gap:2px; align-items:center; height:28px; flex:1; min-width:120px}
.wave i{display:block; width:3px; border-radius:2px; background:var(--primary-lighter)}
.att-audio.playing .wave i{animation:wv .8s ease-in-out infinite alternate}
@keyframes wv{to{background:var(--primary)}}
.att-gif{width:200px; aspect-ratio:4/3; padding:0; justify-content:center; display:grid; place-items:center; border:0}
.att-gif .e{font-size:44px; animation:bob 1.2s ease-in-out infinite}
.att-gif .gtag{position:absolute; left:8px; bottom:8px; background:rgba(38,38,38,.8); color:#fff; font-size:10px; font-weight:800; padding:1px 6px; border-radius:var(--r-sm)}
.att-gif .gl{position:absolute; top:8px; left:0; right:0; text-align:center; font-weight:800; font-size:12px; color:var(--brown)}
.att-link{padding:0; overflow:hidden; align-items:stretch}
.att-link .ui{width:96px; display:grid; place-items:center; font-family:var(--font-head); font-weight:700; font-size:26px; flex:none}
.att-link .lt{padding:10px 14px}
.att-link .dom{font-size:12px; color:var(--text-3); font-weight:700}
.att-link p{font-size:13px; color:var(--text-2); margin-top:2px}
.att-link.loading .lt{color:var(--text-3); font-size:13.5px; display:flex; align-items:center}

/* gate & states */
.center-wrap{display:grid; place-items:start center; padding-top:24px}
.gate{max-width:680px; width:100%; padding:40px 44px; position:relative; overflow:hidden}
.gate .ribbon{position:absolute; right:-30px; top:-30px; width:160px; height:160px; color:var(--yellow); opacity:.9}
.gate h1{font-size:27px; line-height:1.2; max-width:20ch; position:relative}
.gate > p{color:var(--text-2); margin-top:10px; max-width:52ch; position:relative}
.rules{list-style:none; padding:0; margin:26px 0 0; display:grid; gap:14px}
.rules li{display:flex; gap:14px; align-items:flex-start}
.rules .cat-ic{width:38px; height:38px}
.rules .cat-ic svg.i{width:19px; height:19px}
.rules b{display:block; font-size:15px}
.rules span{color:var(--text-2); font-size:14px}
.gate .fine{font-size:13px; color:var(--text-3); margin-top:22px; padding-top:18px; border-top:1px solid var(--border-soft)}
.gate .actions{display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; align-items:center}
.state-card{max-width:520px; width:100%; text-align:center; padding:52px 40px}
.state-card .ill{width:132px; height:110px; display:block; margin:0 auto 22px}
.state-card h1{font-size:23px}
.state-card p{color:var(--text-2); margin-top:10px}
.state-card .actions{display:flex; gap:10px; justify-content:center; margin-top:26px; flex-wrap:wrap}
.notice{display:flex; gap:14px; align-items:center; background:var(--white); border:1.5px solid var(--sand-base); border-radius:var(--r-2xl); padding:14px 18px; margin-bottom:18px; flex-wrap:wrap}
.notice .ic{width:36px; height:36px; border-radius:50%; background:var(--bg-medium); color:var(--brown); display:grid; place-items:center; flex:none}
.notice p{flex:1; min-width:200px; font-size:14px; color:var(--text-2)}
.notice p b{color:var(--text); display:block; font-size:15px}

.skel{background:linear-gradient(90deg, var(--bg-medium) 0%, #F7F2EC 50%, var(--bg-medium) 100%); background-size:200% 100%; animation:shim 1.2s linear infinite; border-radius:var(--r-xl)}
@keyframes shim{to{background-position:-200% 0}}
.loading-label{display:flex; gap:10px; align-items:center; justify-content:center; color:var(--text-2); font-weight:700; font-size:14px; margin:22px 0}
.spinner{width:18px; height:18px; border-radius:50%; border:2.5px solid var(--primary-subtle); border-top-color:var(--primary); animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* home replica */
.home-hero{position:relative; background:var(--bg-medium); border-radius:var(--r-3xl); padding:28px 32px 0; text-align:center; margin-bottom:84px}
.home-hero h1{font-size:34px; position:relative}
.home-hero > p{position:relative; color:var(--text-2); margin-top:6px}
.stat-cards{position:relative; display:flex; gap:12px; justify-content:center; transform:translateY(36px); margin-top:10px}
.stat{display:flex; gap:16px; align-items:center; background:var(--white); border:1.5px solid var(--primary-light); border-radius:var(--r-2xl); padding:14px 18px; width:300px; text-align:left; box-shadow:var(--lift)}
.stat .si{width:52px; height:52px; border-radius:var(--r-lg); background:var(--bg-medium); display:grid; place-items:center; color:var(--brown)}
.stat small{font-family:var(--font-head); font-weight:600; font-size:11.5px; letter-spacing:.02em}
.stat b{display:block; font-family:var(--font-head); font-size:20px; font-weight:600; color:var(--brown)}
.lesson-panel{padding:0}
.lp-head{display:flex; gap:14px; align-items:center; padding:22px 24px; border-bottom:1px solid var(--border-soft)}
.lp-head h2{font-size:18px}
.lp-head small{font-size:13px}
.lesson{display:flex; gap:20px; padding:28px 40px; flex-wrap:wrap}
.lesson .li{width:48px; height:48px; border-radius:var(--r-xl); display:grid; place-items:center; color:#fff}
.lesson h3{font-size:19px}
.lesson .mono{font-family:ui-monospace, "Roboto Mono", monospace; font-size:13px; margin-top:4px}
.lesson .acts{margin-left:auto; display:flex; flex-direction:column; gap:10px; align-items:center; min-width:280px}
.lesson .acts .two{display:flex; gap:10px}
.lesson .acts .two .btn{width:160px}

/* toast & modal */
.toast-wrap{position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:90; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none}
.toast{background:var(--text); color:#fff; padding:12px 18px; border-radius:var(--r-xl); font-size:14px; font-weight:700; display:flex; gap:10px; align-items:center; box-shadow:0 12px 30px -10px rgba(0,0,0,.4); animation:tin .25s ease-out}
.toast svg.i{color:var(--green-subtle); width:18px; height:18px}
@keyframes tin{from{opacity:0; transform:translateY(8px)}}
.scrim{position:fixed; inset:0; background:rgba(46,31,28,.42); z-index:80; display:grid; place-items:center; padding:20px; animation:fin .2s}
@keyframes fin{from{opacity:0}}
.modal{background:var(--white); border-radius:var(--r-3xl); width:100%; max-width:480px; padding:30px; box-shadow:0 30px 70px -20px rgba(0,0,0,.4); max-height:90vh; overflow:auto}
.modal .mi{width:52px; height:52px; border-radius:var(--r-xl); display:grid; place-items:center; margin-bottom:16px}
.modal .mi svg.i{width:26px; height:26px}
.modal h2{font-size:21px}
.modal > p{color:var(--text-2); margin-top:8px; font-size:14.5px}
.modal .actions{display:flex; justify-content:flex-end; gap:10px; margin-top:24px; flex-wrap:wrap}
.modal select.input{appearance:auto}
.sla{display:flex; gap:12px; align-items:center; background:var(--teal-subtle); border-radius:var(--r-xl); padding:14px 16px; margin-top:18px; color:var(--teal-dark); font-size:14px}
.sla b{color:var(--text)}

/* prototype controls */
.proto{position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:70; font-size:13px}
.proto-toggle{display:flex; gap:8px; align-items:center; background:var(--brown); color:#fff; border:0; border-radius:var(--r-full); padding:10px 16px; font-weight:800; box-shadow:0 10px 24px -8px rgba(0,0,0,.45)}
.proto-toggle svg.i{width:16px; height:16px}
.proto-panel{position:absolute; right:0; bottom:52px; width:300px; max-height:calc(100vh - 110px); overflow:auto; background:var(--white); border:1px solid var(--border-soft); border-radius:var(--r-2xl); box-shadow:0 24px 60px -20px rgba(0,0,0,.4); padding:16px}
.proto-panel h4{font-family:var(--font-body); font-weight:800; font-size:12px; color:var(--text-3); margin:14px 0 8px}
.proto-panel h4:first-child{margin-top:0}
.proto-roles{display:grid; gap:6px}
.proto-roles button{display:flex; gap:10px; align-items:center; border:1.5px solid var(--border-soft); background:var(--white); border-radius:var(--r-lg); padding:8px 10px; text-align:left; font-weight:700}
.proto-roles button.on{border-color:var(--primary); background:var(--primary-wash)}
.proto-roles small{display:block; font-weight:600; color:var(--text-3); font-size:11.5px}
.proto-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:6px 0; font-weight:700}
.switch{width:40px; height:22px; border-radius:var(--r-full); background:var(--border); border:0; position:relative; padding:0; flex:none}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s}
.switch.on{background:var(--primary)}
.switch.on::after{left:21px}
.jump{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.jump button{border:1px solid var(--border-soft); background:var(--bg); border-radius:var(--r-lg); padding:7px 8px; font-size:12px; font-weight:700; text-align:left}
.jump button:hover{border-color:var(--primary-light); background:var(--primary-wash)}
.proto-note{font-size:11.5px; color:var(--text-3); margin-top:12px; line-height:1.45}

/* responsive */
@media (max-width:1080px){
  .topics{grid-template-columns:repeat(3,1fr)}
  .combo{grid-template-columns:1fr}
  .mostread{border-left:0; border-top:1px solid var(--border-soft)}
  .thread,.article-wrap{grid-template-columns:1fr}
  .cats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed; left:0; top:0; bottom:0; width:260px; transform:translateX(-100%); transition:transform .2s; box-shadow:0 0 40px rgba(0,0,0,.2)}
  .app.nav-open .sidebar{transform:none}
  .menu-btn{display:grid}
  .collapse-btn{display:none}
  .content{padding:18px 16px 120px}
  .topbar{padding:0 16px}
  .videos,.split,.two-col{grid-template-columns:1fr}
  .cat-nav{position:static; flex-direction:row; overflow-x:auto}
  .cat-nav h3{display:none}
  .cat-nav a{white-space:nowrap; background:var(--white)}
  .stat-cards{flex-direction:column; align-items:center; transform:translateY(24px)}
  .home-hero{margin-bottom:180px}
  .lesson{padding:22px}
  .lesson .acts{margin-left:0; min-width:0; width:100%}
}
@media (max-width:620px){
  .arts-head,.filter-row{padding-left:18px; padding-right:18px}
  .filter-row{flex-wrap:nowrap; overflow-x:auto}
  .arts-body .aitem,.arts-body .result-meta{padding-left:18px; padding-right:18px}
  .topics{grid-template-columns:repeat(2,1fr)}
  .fcols{display:none}
  .frow{grid-template-columns:1fr; gap:8px}
  .fnum{display:none}
  .flast{padding-left:50px}
  .cats{grid-template-columns:1fr}
  .vcard.row{flex-direction:column}
  .vcard.row .thumb{width:100%; aspect-ratio:16/9; min-height:0}
  .hero{padding:32px 18px 0}
  .hero h1{font-size:26px}
  .hero-art{opacity:.45}
  .searchbar input{font-size:15px}
  .article,.op,.gate{padding:24px 20px}
  .post-row{flex-wrap:wrap}
  .stats{width:100%; padding-left:52px}
  .gif-grid{grid-template-columns:repeat(3,1fr)}
  .crumbs .hide-sm{display:none}
  .proto-toggle span{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important; transition:none !important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Main menu"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content" tabindex="-1"></main>
  </div>
</div>
<div class="toast-wrap" id="toasts" role="status" aria-live="polite"></div>
<div id="modal-root"></div>
<div class="proto" id="proto"></div>

<script>
/* =========================================================
   Icons

const daysAgo = (n, h=10) => { const d = new Date(NOW); d.setDate(d.getDate()-n); d.setHours(h,0,0,0); return d; };
function relDate(d){
  const diff = Math.round((new Date(NOW).setHours(0,0,0,0) - new Date(d).setHours(0,0,0,0)) / 864e5);
  if (diff <= 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  if (diff < 7) return diff + ' days ago';
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
}

function route(){
  const h = location.hash.replace(/^#/, '') || '/home';
  const [path, qs] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  const q = new URLSearchParams(qs||'');
  return {parts, q, path};
}
function go(hash){ if (location.hash === hash) render(); else location.hash = hash; }
function gbRouteKey(){
  const p = route().parts;
  if (p[0] === 'gradebook' && p[4] !== 'a') return p.slice(0, 4).join('/');
  if (p[0] === 'my-grades' && p[3] !== 'a') return p.slice(0, 3).join('/');
  return null;
}
function checkGbLoad(){
  const k = gbRouteKey();
  if (k && k !== S.lastGbKey){ if (k.includes('/c/')) S.gbOpen = new Set(); startGbLoad(); }
  if (k) S.lastGbKey = k; else if (!/^#\/(gradebook|my-grades)/.test(location.hash)) S.lastGbKey = null;
}
window.addEventListener('hashchange', () => { checkGbLoad(); S.menu = null; S.rxMenu = null; S.playing = null; document.getElementById('app').classList.remove('nav-open'); render(); window.scrollTo(0,0); });

   Views: articles
   ========================================================= */
function searchArticles(q){
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  return ARTICLES.map(a => {
    const hay = (a.title+' '+a.summary+' '+a.intro+' '+a.steps.join(' ')+' '+catById(a.cat).name).toLowerCase();
    const title = a.title.toLowerCase();
    let score = 0;
    for (const t of terms){ const stem = t.replace(/(ing|es|s)$/,''); if (title.includes(stem)) score += 3; else if (hay.includes(stem)) score += 1; else return null; }
    return {a, score};
  }).filter(Boolean).sort((x,y) => y.score - x.score).map(x => x.a);
}
function hl(text, q){
  if (!q) return esc(text);
  let out = esc(text);
  q.split(/\s+/).filter(t => t.length > 2).forEach(t => {
    const stem = t.replace(/(ing|es|s)$/,'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    out = out.replace(new RegExp('('+stem+')', 'ig'), '<mark>$1</mark>');
  });
  return out;
}
function articleItem(a, q){
  return `<a class="aitem" href="#/support/article/${a.id}">
    <span class="cat-ic ${catById(a.cat).tone}" style="width:38px;height:38px">${ic(catById(a.cat).icon)}</span>
    <div><h4>${hl(a.title,q)}</h4><p>${hl(a.summary,q)}</p>
    <div class="tags"><span class="chip chip-sand">${catById(a.cat).name}</span>${a.video?`<span class="chip chip-teal">${ic('play')}Video ${a.video}</span>`:''}<span class="chip chip-sand">${a.reads}</span></div></div>
    <span class="chev">${ic('chevRight')}</span></a>`;
}
function viewArticles(r){
  const q = (r.q.get('q')||'').trim();
  const cat = r.q.get('cat');
  const videoOnly = r.q.get('video') === '1';
  const crumbs = [['Articles','#/support/articles']];
  if (q) crumbs.push(['Search results','#']); else if (cat) crumbs.push([catById(cat).name,'#']);
  supportCrumbs(crumbs);
  let body;
  if (q){
    const res = searchArticles(q);
    body = res.length
      ? `<p class="result-meta"><b>${res.length} ${res.length===1?'article':'articles'}</b> for \u201c${esc(q)}\u201d <button class="link-btn" style="margin-left:8px" data-act="nav" data-to="#/support/articles">Clear search</button></p><div class="alist">${res.map(a => articleItem(a,q)).join('')}</div>
         <p class="help" style="margin-top:16px">Not what you\u2019re looking for? <a href="#/support/community/new" data-act="ask-with" data-q="${esc(q)}">Ask in Community Q&A</a></p>`
      : `<div class="empty" role="status">
          <svg class="art" viewBox="0 0 120 96" aria-hidden="true"><circle cx="52" cy="44" r="30" fill="#F1EBE3"/><circle cx="52" cy="44" r="18" fill="none" stroke="#7E4BA3" stroke-width="6"/><path d="m66 58 18 18" stroke="#7E4BA3" stroke-width="7" stroke-linecap="round"/><path d="M90 20c8 4 12 10 12 18" stroke="#FFBD26" stroke-width="5" stroke-linecap="round" fill="none"/></svg>
          <h3>No articles match \u201c${esc(q)}\u201d</h3>
          <p>Try different words, like \u201clesson\u201d or \u201cbilling.\u201d Or ask other Learning Coaches. The StrongMind team responds within 24\u201348 hours.</p>
          <div class="actions"><a class="btn btn-primary" href="#/support/community/new" data-act="ask-with" data-q="${esc(q)}">${ic('chat')}Ask in Community Q&A</a><a class="btn btn-outline" href="#/support/articles">Browse all articles</a></div>
        </div>`;
  } else {
    const items = ARTICLES.filter(a => (!cat || a.cat === cat) && (!videoOnly || a.video));
    const label = videoOnly ? 'with walkthrough videos' : cat ? 'in ' + catById(cat).name : '';
    body = `<p class="result-meta"><b>${items.length} articles</b> ${label}${cat||videoOnly?` <button class="link-btn" style="margin-left:8px" data-act="nav" data-to="#/support/articles">Clear filter</button>`:''}</p>
      <div class="alist">${items.map(a => articleItem(a)).join('')}</div>`;
  }
  const filters = [['All articles','#/support/articles', !cat && !videoOnly, ARTICLES.length, null],
    ['Has a video','#/support/articles?video=1', videoOnly, ARTICLES.filter(a=>a.video).length, 'video'],
    ...CATS.map(c => [c.short, '#/support/articles?cat='+c.id, cat===c.id, ARTICLES.filter(a=>a.cat===c.id).length, c.icon])];
  return `
    <section class="panel articles-box" aria-labelledby="arts-h">
      <div class="arts-head">
        <div><h1 id="arts-h">${q ? 'Search articles' : 'Help articles'}</h1><p>Step-by-step answers from the StrongMind team.</p></div>
        <form class="searchbar inline" role="search" data-form="search">${ic('search')}<label class="sr" for="art-q">Search articles</label>
          <input id="art-q" name="q" type="search" value="${esc(q)}" placeholder="Search ${ARTICLES.length} articles" autocomplete="off"><button class="btn btn-primary btn-sm" type="submit">Search</button></form>
      </div>
      ${q ? '' : `<nav class="filter-row" aria-label="Filter articles">${filters.map(f => `<a href="${f[1]}" class="fpill ${f[2]?'on':''}" ${f[2]?'aria-current="true"':''}>${f[4]?ic(f[4]):''}${f[0]}<span>${f[3]}</span></a>`).join('')}</nav>`}
      <div class="arts-body">${body}</div>
    </section>`;
}

function feedPosts(){
  const live = POSTS.filter(p => !p.removed);
  let pinned = live.filter(p => p.pinned);
  if (S.customPinOrder) pinned.sort((a,b) => S.pinOrder.indexOf(a.id) - S.pinOrder.indexOf(b.id));
  else pinned.sort((a,b) => b.pinnedAt - a.pinnedAt);
  let unpinned = live.filter(p => !p.pinned).sort((a,b) => b.date - a.date);
  if (S.feedFilter === 'waiting') unpinned = unpinned.filter(p => !p.replies.length);
  if (S.feedFilter === 'mine') unpinned = unpinned.filter(p => p.author === ME());
  return {pinned, unpinned};
}
function badgeFor(pid){
  const p = PEOPLE[pid];
  if (p.staff) return `<span class="badge-staff" title="StrongMind team member"><span class="org"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 6 13.5h5L9.5 22 18 9.5h-5.2z" fill="#FFBD26"/></svg>StrongMind</span><span class="role">${p.staff}</span></span>`;
  if (p.founder) return `<span class="badge-founder" title="Founding Member">${ic('star')}Founding Member</span>`;
  return '';
}
const avatar = (pid, sm) => { const p = PEOPLE[pid]; return `<span class="av ${sm?'sm':''} ${p.staff?'staff':''}" style="background:${p.color}" aria-hidden="true">${p.name[0]}</span>`; };
const displayName = pid => pid === ME() ? PEOPLE[pid].name + ' (you)' : PEOPLE[pid].name;
const totalRx = o => Object.values(o.reactions||{}).reduce((a,b)=>a+b,0);

function reactionsBar(target, obj){

function replyHTML(p, r){

/* ---------- attachments ---------- */
function attHTML(a, key, idx){
  const rm = key != null ? `<button class="x" data-act="att-remove" data-k="${key}" data-i="${idx}" aria-label="Remove attachment">${ic('x')}</button>` : '';
  if (a.type === 'video') return `<div class="att att-video"><span class="vt">${ic('play')}</span><div><b>${esc(a.name)}</b><span class="s">Video${a.size?', '+esc(a.size):''}</span></div>${rm}</div>`;
  if (a.type === 'audio'){
    const bars = Array.from({length:34}, (_,i) => `<i style="height:${6 + Math.round(Math.abs(Math.sin(i*1.7+a.name.length))*20)}px; animation-delay:${(i%7)*.08}s"></i>`).join('');
    return `<div class="att att-audio" style="min-width:300px"><button class="ap" data-act="audio-play" aria-label="Play ${esc(a.name)}">${ic('play')}</button><div style="flex:1"><b style="font-size:13px">${esc(a.name)}</b><div class="wave">${bars}</div></div><span class="s">${esc(a.dur)}</span>${rm}</div>`;
  }
  if (a.type === 'gif') return `<div class="att att-gif g${a.g}" role="img" aria-label="GIF: ${esc(a.label)}"><span class="gl">${esc(a.label)}</span><span class="e">${a.e}</span><span class="gtag">GIF</span>${rm}</div>`;
  if (a.type === 'link'){
    if (a.loading) return `<div class="att att-link loading"><span class="ui t-purple"><span class="spinner"></span></span><div class="lt">Getting a preview of ${esc(a.url)}</div>${rm}</div>`;
    return `<a class="att att-link" href="${esc(a.url)}" target="_blank" rel="noopener" onclick="return false"><span class="ui ${a.tone}">${esc(a.initial)}</span><div class="lt"><span class="dom">${esc(a.domain)}</span><b>${esc(a.title)}</b><p>${esc(a.desc)}</p></div>${rm}</a>`;
  }
  return '';
}

      <div class="actions"><button class="btn btn-quiet" data-act="dlg-close" data-then="#/support/community">Back to Community Q&A</button><button class="btn btn-primary" data-act="dlg-close" data-then="#/support/community/p/${d.id}">View my post</button></div></div>`;
  } else {

    const reasonSel = `<div class="field" style="margin-top:18px"><label for="m-r">Reason</label><select class="input" id="m-r">${reasons.map(x => `<option ${p.reported&&x==='Off-topic or promotion'?'selected':''}>${x}</option>`).join('')}</select></div>`;

    if (d.type === 'remove-member') html = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-t">
      <span class="mi t-coral">${ic('userX')}</span><h2 id="m-t">Remove ${esc(who)} from Community Support?</h2>
      <p>They won\u2019t be able to post, reply, or react. Their household\u2019s learning, plans, and articles aren\u2019t affected.</p>${reasonSel}
      <label style="display:flex; gap:8px; align-items:center; font-size:14px; font-weight:700"><input type="checkbox" checked id="m-also"> Also remove this ${r?'reply':'post'}</label>
      <div class="actions"><button class="btn btn-quiet" data-act="dlg-close">Cancel</button><button class="btn btn-danger" data-act="do-remove-member">Remove member</button></div></div>`;
    if (d.type === 'escalate') html = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-t">
      <span class="mi t-yellow">${ic('shield')}</span><h2 id="m-t">Escalate this violation</h2>
      <p>Sends this ${r?'reply':'post'} and its history to the StrongMind Trust & Safety team for review. The member isn\u2019t notified.</p>
      <div class="field" style="margin-top:18px"><label for="m-s">Priority</label><select class="input" id="m-s"><option>Needs review in 1 business day</option><option>Urgent: possible safety concern</option></select></div>
      <div class="field"><label for="m-n">Note for Trust & Safety <span class="opt">(optional)</span></label><textarea class="input" id="m-n" style="min-height:90px" placeholder="What did you notice?"></textarea></div>
      <div class="actions"><button class="btn btn-quiet" data-act="dlg-close">Cancel</button><button class="btn btn-primary" data-act="do-escalate">Escalate</button></div></div>`;
  }
  root.innerHTML = `<div class="scrim" data-act="scrim">${html}</div>`;
  const first = root.querySelector('select, .btn-primary, .btn-danger'); if (first) first.focus();
}
function resolveTarget(t){
  const bits = t.split(':');
  const p = postById(bits[1]);
  const r = bits[0] === 'r' ? p.replies.find(x => x.id === bits[2]) : null;
  return {p, r};
}
