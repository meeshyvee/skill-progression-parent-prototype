const courseById = id => COURSES.find(c => c.id === id);
const coursesFor = lid => COURSES.filter(c => c.learner === lid);
const catW = (c, cat) => (c.cats.find(k => k.id === cat) || {w:0}).w;
const visItems = (c, l) => (l.items || []).filter(it => catW(c, it.cat) > 0);
const visLessons = (c, u) => c.graded ? u.lessons.filter(l => visItems(c, l).length) : u.lessons;
const visUnits = c => c.units.filter(u => visLessons(c, u).length);
const allLessons = c => c.units.flatMap(u => visLessons(c, u));
const lastAttempt = it => it.attempts[it.attempts.length - 1];
const isGradedDone = it => it.state === 'complete' && it.attempts.length > 0;
const isNoSub = it => it.state === 'complete' && !it.attempts.length;
function lessonState(l){
  if (!l.items) return l.state;
  const s = l.items.map(i => i.state);
  if (s.every(x => x === 'complete')) return 'complete';
  if (s.every(x => x === 'not')) return 'not';
  return 'progress';
}
function itemScore(it){
  if (!isGradedDone(it)) return null;
  const a = lastAttempt(it);
  const right = it.questions.filter((q, i) => a.answers[i] === q.k).length;
  return {right, total: it.questions.length, pct: Math.round(right / it.questions.length * 100), date: a.date};
}
function courseGrade(c){
  const cats = c.cats.filter(k => k.w > 0).map(k => ({...k, scores: []}));
  c.units.forEach(u => u.lessons.forEach(l => (l.items || []).forEach(it => {
    const k = cats.find(x => x.id === it.cat); const s = itemScore(it);
    if (k && s) k.scores.push(s.pct);
  })));
  let wsum = 0, tot = 0, n = 0;
  cats.forEach(k => { if (k.scores.length){ k.avg = Math.round(k.scores.reduce((a, b) => a + b, 0) / k.scores.length); wsum += k.w; tot += k.avg * k.w; n += k.scores.length; } });
  return {pct: wsum ? Math.round(tot / wsum) : 0, n, cats};
}
function courseProgress(c){
  const ls = allLessons(c);
  const done = ls.filter(l => lessonState(l) === 'complete').length;
  return {done, total: ls.length, pct: ls.length ? Math.round(done / ls.length * 100) : 0};
}
function starsIn(c){
  let n = 0; c.units.forEach(u => visLessons(c, u).forEach(l => visItems(c, l).forEach(it => { const s = itemScore(it); if (s) n += s.right; })));
  return n;
}
const findLesson = (c, lid) => { for (const u of c.units) for (const l of u.lessons) if (l.id === lid) return {u, l}; return {}; };
const findItem = (c, iid) => { for (const u of c.units) for (const l of u.lessons) for (const it of (l.items || [])) if (it.id === iid) return {u, l, it}; return {}; };

function gradeSnapshot(c, L, g, p){
  const graded = []; c.units.forEach(u => visLessons(c, u).forEach(l => visItems(c, l).forEach(it => { const s = itemScore(it); if (s) graded.push({it, s, cat: c.cats.find(k => k.id === it.cat)}); })));
  const top = graded.reduce((a, b) => b.s.pct > a.s.pct ? b : a, graded[0]);
  const recent = graded.reduce((a, b) => b.s.date > a.s.date ? b : a, graded[0]);
  const R = 52, C = 2 * Math.PI * R, off = C * (1 - g.pct / 100);
  const catColors = ['#008FA9','#F87760','#7E4BA3','#FFBD26'];
  const ring = `<div class="snap-ring"><svg viewBox="0 0 128 128" aria-hidden="true"><circle cx="64" cy="64" r="${R}" fill="none" stroke="#F1EBE3" stroke-width="14"/><circle cx="64" cy="64" r="${R}" fill="none" stroke="url(#rg-${c.id})" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 64 64)" class="ring-arc" style="--c:${C.toFixed(1)}"/><defs><linearGradient id="rg-${c.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B182D2"/><stop offset="1" stop-color="#7E4BA3"/></linearGradient></defs></svg>
    <div class="snap-ring-t"><b>${g.pct}%</b><small>Overall</small></div></div>`;
  const cats = g.cats.map((k, i) => `<div class="snap-cat"><div class="snap-cat-h"><span><i style="background:${catColors[i % 4]}"></i>${k.name}<em>${k.w}% of grade</em></span><b>${k.avg != null ? k.avg + '%' : '\u2014'}</b></div><span class="snap-bar"><i style="width:${k.avg || 0}%; background:${catColors[i % 4]}"></i></span>${k.avg == null ? '<small class="muted">No graded work yet</small>' : ''}</div>`).join('');
  const bars = graded.map(x => { const ci = g.cats.findIndex(k => k.id === x.cat.id); return `<div class="snap-col" title="${esc(x.it.title)}: ${x.s.pct}%"><span class="snap-v">${x.s.pct}</span><i style="height:${Math.max(6, x.s.pct)}%; background:${catColors[ci % 4]}"></i></div>`; }).join('');
  return `<div class="snap">
    <div class="snap-main">${ring}<div class="snap-cats"><h3>How the grade is weighted</h3>${cats}</div></div>
  </div>`;
}
function lessonRowGb(c, l, lid, viewOnly){

</div>

function itemRow(c, it, lid){

function viewGbAssignment(lid, cid, iid, kid){
  const c = courseById(cid);

  if (!it) return isAdult() ? viewGbCourse(lid, cid) : viewMyCourse(cid);

  if (learner) renderTopbar([['My Grades','#/my-grades'],[c.title,'#/my-grades/c/' + cid],[it.title,'#']]);
  else renderTopbar([[L.name,'#/learner/' + lid],['Gradebook','#/gradebook/' + lid],[c.title,'#/gradebook/' + lid + '/c/' + cid],[it.title,'#']]);
  const s = itemScore(it), st = itemState(it);
  const submitted = !!s;
  const down = lrnDown();
  const backHref = learner ? '#/my-grades/c/' + cid : '#/gradebook/' + lid + '/c/' + cid;
  let scoreBox;
  if (down && submitted) scoreBox = `<div class="gb-grade na"><b>Unavailable</b><small>${learner ? 'Score' : 'Score, most recent attempt'}</small></div>`;
  else if (!submitted) scoreBox = `<div class="gb-grade na"><b>${st === 'nosub' ? 'No grade' : 'Not submitted'}</b><small>${st === 'nosub' ? 'Marked complete, not in the course grade' : 'No answers yet'}</small></div>`;

  const a = submitted ? lastAttempt(it) : null;
  const qs = it.questions.map((q, i) => {
    const resp = a ? a.answers[i] : null;
    const ok = resp != null && resp === q.k;
    const respBox = down ? `<div class="gb-unavail">${ic('cloudOff')}${k2 ? 'Your answer can\u2019t load right now.' : 'Response unavailable right now'}</div>`

    const notes = learner ? '' : down ? `<div class="gb-unavail notes">${ic('cloudOff')}Grading notes unavailable right now</div>`
      : q.n ? `<aside class="lrn-instructor" aria-label="Grading notes"><span class="lrn-tag">${ic('bulb')}Instructor stimulus</span><b>Grading notes</b><p>${esc(q.n)}</p></aside>` : '';

    return `<article class="gb-q ${k2 ? 'kid' : ''}">
      <div class="gb-qhead"><span class="gb-qn">${k2 ? i + 1 : 'Question ' + (i + 1)}</span>${qScore}</div>

      ${notes}</article>`;
  }).join('');
  return `${learner ? `<a class="back" href="${backHref}">${ic('arrowLeft')}${c.title}</a>` : ''}
    ${down ? `<div class="gb-notice" role="status"><span class="ic">${ic('cloudOff')}</span><div><b>${k2 ? 'Some of your answers can\u2019t load right now.' : 'Some assignment details are temporarily unavailable.'}</b>${k2 ? 'Try again in a little while.' : 'Responses, the answer key, and grading notes couldn\u2019t load. Everything else on this page is still here.'}</div><button class="btn btn-outline btn-sm" data-act="gb-retry">${ic('refresh')}${k2 ? 'Try again' : 'Retry'}</button></div>` : ''}
    <section class="panel gb-ahead ${k2 ? 'kid' : ''}">
      <div><span class="chip chip-sand">${c.cats.find(x => x.id === it.cat).name}</span><h1>${it.title}</h1>
        <p>${learner ? '' : 'Unit: ' + u.title + ', '}Lesson ${l.num}: ${l.title}</p><div style="margin-top:10px">${stateChip(st, {kid: k2})}</div></div>
      ${scoreBox}
    </section>
    ${!submitted && !down ? `<div class="gb-vo">${ic('doc')}<span>${st === 'nosub' ? 'This lesson was marked complete without a submission, so there are no responses to show.' : learner ? 'You haven\u2019t answered these yet.' : `${L.name} hasn\u2019t submitted this assignment yet. Questions are shown with blank responses.`}</span></div>` : ''}
    ${!learner && it.cat === 'mile' ? `<div class="lens-note small">${ic('diamond')}<div>This is ${L.name}\u2019s score on the <b>online milestone activity</b>. The milestone\u2019s mastery level is recorded separately by an adult in ${L.name}\u2019s Learning Journey, after the offline assessment.</div></div>` : ''}
    <div class="gb-qs">${qs}</div>`;

/* ---------- actions ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  switch(a){
    case 'gb-year': { const k = el.dataset.k; const y = k.split('|')[1]; const cur = S.yearOpen[k] ?? (y === YEAR_NOW); S.yearOpen[k] = !cur; render(); break; }
    case 'gb-toggle': { const k = el.dataset.k; S.gbOpen.has(k) ? S.gbOpen.delete(k) : S.gbOpen.add(k); render(); break; }
    case 'gb-expand': { const c = courseById(el.dataset.c); const us = visUnits(c); const all = us.every(u => S.gbOpen.has('u:' + u.id));
      us.forEach(u => { all ? S.gbOpen.delete('u:' + u.id) : S.gbOpen.add('u:' + u.id); visLessons(c, u).forEach(l => all ? S.gbOpen.delete('l:' + l.id) : S.gbOpen.add('l:' + l.id)); }); render(); break; }
    case 'gb-reopen': S.dialog = {type:'reopen', cid:el.dataset.c, lid:el.dataset.l, stage:'choose'}; renderModal(); break;
    case 'gb-reopen-set': {
      const d = S.dialog; d.choice = el.dataset.s;
      if (S.reopenFail){ d.stage = 'error'; renderModal(); break; }
      const c = courseById(d.cid), {l} = findLesson(c, d.lid);
      if (l.items) l.items.forEach(it => it.state = d.choice); else l.state = d.choice;
      S.reopened = [{cid:d.cid, lid:d.lid}, ...S.reopened.filter(r => r.lid !== d.lid)];
      delete S.redoDraft[d.cid + ':' + d.lid];
      S.dialog = null; render(); break; }
    case 'gb-complete': S.dialog = {type:'complete', cid:el.dataset.c, lid:el.dataset.l, stage:'confirm'}; renderModal(); break;
    case 'gb-complete-do': {
      const d = S.dialog;
      if (S.reopenFail){ d.stage = 'error'; renderModal(); break; }
      const c = courseById(d.cid), {l} = findLesson(c, d.lid);
      if (l.items) l.items.forEach(it => it.state = 'complete'); else l.state = 'complete';
      S.reopened = S.reopened.filter(r => r.lid !== d.lid);
      S.dialog = null; render(); break; }
    case 'gb-retry': S.lrn = 'ok'; startGbLoad(); render(); break;
    case 'course-retry': S.courseFail = false; startGbLoad(); render(); break;
    case 'redo-pick': { const d = S.redoDraft[el.dataset.k]; d[el.dataset.i][Number(el.dataset.q)] = el.dataset.v;
      el.parentElement.querySelectorAll('.choice').forEach(b => { b.classList.toggle('on', b === el); b.setAttribute('aria-checked', b === el); }); break; }
    case 'redo-submit': {
      const key = el.dataset.k; const [cid, lid] = key.split(':');
      if (S.resubmitFail){ S.redoErr[key] = true; render(); document.querySelector('[role=alert]')?.scrollIntoView({block:'center'}); break; }
      const c = courseById(cid), {l} = findLesson(c, lid);
      (l.items || []).forEach(it => { if (S.redoDraft[key] && S.redoDraft[key][it.id]) it.attempts.push({answers:S.redoDraft[key][it.id].slice(), date:new Date(NOW)}); it.state = 'complete'; });
      if (!l.items) l.state = 'complete';
      S.reopened = S.reopened.filter(r => r.lid !== lid); delete S.redoDraft[key]; delete S.redoErr[key];
      S.dialog = {type:'redone'}; go('#/home'); break; }
    case 'set-lrn': S.lrn = el.dataset.v; render(); break;
    case 'lgb-filter': S.lgbFilter = S.lgbFilter === el.dataset.v ? 'all' : el.dataset.v; render(); break;
    case 'l2-more': toast('More lesson options aren\u2019t part of this prototype'); break;
    case 'pl-remove': S.dialog = {type:'rmcourse', c:el.dataset.c}; renderModal(); break;
    case 'pl-remove-do': { const c = courseById(el.dataset.c); c.removed = true; S.dialog = null; render(); toast(`${c.title} removed from ${LEARNERS[c.learner].name}\u2019s plan`); break; }
    case 'pl-restore': { const c = courseById(el.dataset.c); c.removed = false; render(); toast(`${c.title} restored. ${LEARNERS[c.learner].name} will pick up where they left off.`); break; }
    case 'cart-toggle': S.cartOpen = !S.cartOpen; render(); break;
    case 'arch-year': S.archYear = el.dataset.v; render(); break;
    case 'gb-jumpto': document.getElementById('gbl-' + el.dataset.l)?.scrollIntoView({behavior:'smooth', block:'start'}); break;
    case 'gb-flag': S[el.dataset.f] = !S[el.dataset.f]; render(); break;
  }
});

function render(){
  const r = route();
  renderSidebar(r);
  const c = document.getElementById('content');
  let html;
  if (r.parts[0] === 'support'){
    const gate = S.role === 'learner' ? viewDenied() : S.simError ? viewError() : !S.accepted[S.role] ? viewGuidelines() : S.loading ? viewLoading() : null;
    if (gate) html = gate;
    else if (!r.parts[1]) html = viewHub();
    else if (r.parts[1] === 'articles') html = viewArticles(r);
    else if (r.parts[1] === 'article') html = viewArticle(r.parts[2]);
    else if (r.parts[1] === 'community' && r.parts[2] === 'new') html = viewCompose();
    else if (r.parts[1] === 'community' && r.parts[2] === 'p') html = viewPost(r.parts[3]);
    else html = viewCommunity();
  } else if (r.parts[0] === 'gradebook'){
    if (S.role === 'learner') html = viewMyGrades();
    else if (r.parts[4] === 'a') html = viewGbAssignment(r.parts[1], r.parts[3], r.parts[5]);
    else if (r.parts[2] === 'c') html = viewGbCourse(r.parts[1], r.parts[3]);
    else if (!r.parts[1] || r.parts[1] === 'archive') { const a = allowedLearners(); html = a.length ? viewGradebook(a[0]) : viewGbNoLearners(); }
    else html = viewGradebook(r.parts[1]);
  } else if (r.parts[0] === 'my-grades'){
    if (S.role !== 'learner') html = viewHome();
    else if (r.parts[3] === 'a') html = viewGbAssignment(S.learnerId, r.parts[2], r.parts[4]);
    else if (r.parts[1] === 'c') html = viewMyCourse(r.parts[2]);
    else html = viewMyGrades();
  } else if (r.parts[0] === 'plan') html = viewPlan(r.parts[1]);
  else if (r.parts[0] === 'learner' && S.role !== 'learner' && r.parts[3] === 'guide') html = viewGuide(r.parts[1], r.parts[2]);
  else if (r.parts[0] === 'learner' && S.role !== 'learner') html = viewLearnerProfile(r.parts[1], r.parts[2]);
  else if (r.parts[0] === 'redo' && S.role === 'learner') html = viewRedo(r.parts[1], r.parts[2]);
  else html = viewHome();
  c.innerHTML = html;
  if (S.gbFocus && !S.gbLoading && r.parts[0] === 'gradebook' && !r.parts[2]){ const f = S.gbFocus; setTimeout(() => { const el = document.getElementById('gbl-' + f); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); }, 30); S.gbFocus = null; }
  renderModal();
  renderProto();
}

function toggleReaction(target, e){
  const {p, r} = resolveTarget(target);
  const o = r || p;
  o.reactions = o.reactions || {};
  if (o.mine.includes(e)){ o.mine = o.mine.filter(x => x !== e); o.reactions[e]--; if (!o.reactions[e]) delete o.reactions[e]; }
  else { o.mine.push(e); o.reactions[e] = (o.reactions[e]||0) + 1; }
}
function unfurl(url){
  let u; try{ u = new URL(/^https?:\/\//.test(url) ? url : 'https://'+url); }catch(e){ return null; }
  if (!u.hostname.includes('.')) return null;
  const domain = u.hostname.replace(/^www\./,'');
  const known = {
    'youtube.com':['Video on YouTube','Watch on YouTube.','t-coral'],
    'youtu.be':['Video on YouTube','Watch on YouTube.','t-coral'],
    'strongmind.com':['StrongMind Homeschool','Articles and updates from StrongMind.','t-purple'],
    'help.strongmind.com':['StrongMind help article','Step-by-step help from the StrongMind team.','t-purple']
  };
  const k = known[domain] || [ (u.pathname.split('/').filter(Boolean).pop()||domain).replace(/[-_]/g,' ').replace(/\.\w+$/,'').replace(/^\w/, c=>c.toUpperCase()), 'A page on '+domain+'.', 't-teal'];
  return {type:'link', url:u.href, domain, title:k[0], desc:k[1], tone:k[2], initial:domain[0].toUpperCase()};
}

      if (also){ if (r) p.replies = p.replies.filter(x => x !== r); else p.removed = true; }
      toast(PEOPLE[who].name + ' was removed from Community Support');
      if (also && !r) go('#/support/community'); else render(); break; }
    case 'do-escalate': { const {p, r} = resolveTarget(S.dialog.t); (r||p).escalated = true; S.dialog = null; toast('Escalated to Trust & Safety'); render(); break; }

    /* composer */
    case 'panel': { const d = draft(k); d.panel = d.panel === el.dataset.p ? null : el.dataset.p; d.err.link = null; rerenderComposer(k); break; }
    case 'pick': { const d = draft(k); d.err.file = null; const inp = document.querySelector(`[data-file="${k}"]`); inp.dataset.kind = el.dataset.kind; inp.value = ''; inp.click(); break; }
    case 'att-remove': { const d = draft(k); d.atts.splice(Number(el.dataset.i), 1); rerenderComposer(k); break; }
    case 'add-gif': { const d = draft(k); const g = GIFS.find(x => x.g == el.dataset.g); d.atts.push({type:'gif', g:g.g, e:g.e, label:g.label}); d.panel = null; d.err.file = null; rerenderComposer(k); break; }
    case 'add-link': {
      const d = draft(k); const v = (d.linkVal||'').trim(); const info = unfurl(v);
      if (!info){ d.err.link = 'Enter a full web address, like https://example.com'; rerenderComposer(k); break; }
      d.err.link = null; d.panel = null; d.linkVal = ''; const ph = {type:'link', loading:true, url:info.url}; d.atts.push(ph); rerenderComposer(k);
      setTimeout(() => { const i = d.atts.indexOf(ph); if (i > -1){ d.atts[i] = info; rerenderComposer(k); } }, 700); break; }
    case 'rec-start': {
      const d = draft(k); d.rec = {t:0}; rerenderComposer(k);
      clearInterval(recTimer); recTimer = setInterval(() => { d.rec && d.rec.t++; const s = document.querySelector(`#composer-${cssKey(k)} [data-rectime]`); if (s && d.rec) s.textContent = '0:' + String(d.rec.t).padStart(2,'0'); }, 1000); break; }
    case 'rec-stop': { const d = draft(k); clearInterval(recTimer); const t = Math.max(3, d.rec ? d.rec.t : 3); d.rec = null; d.panel = null; d.atts.push({type:'audio', name:'Voice note', dur:'0:' + String(t).padStart(2,'0')}); rerenderComposer(k); break; }
    case 'audio-play': { const box = el.closest('.att-audio'); box.classList.toggle('playing'); break; }
    case 'submit-post': {
      const d = draft('post'); d.err = {};
      if (!d.title.trim()) d.err.title = 'Add a title so others know what you\u2019re asking.';
      if (!d.body.trim()) d.err.body = 'Add some details before posting. A post can\u2019t be empty.';
      if (d.err.title || d.err.body){ rerenderComposer('post'); document.querySelector('.input.err')?.focus(); break; }
      const id = 'new-' + Date.now();
      POSTS.unshift({id, title:d.title.trim(), body:d.body.trim(), author:ME(), date:new Date(NOW), atts:d.atts.filter(x => !x.loading), reactions:{}, mine:[], replies:[]});
      delete S.drafts.post; S.dialog = {type:'posted', id}; S.feedFilter = 'all'; render(); break; }
    case 'submit-reply': {
      const d = draft(k); d.err = {};
      if (!d.body.trim()){ d.err.body = 'Write a response before posting. You can add a video, audio, or GIF too.'; rerenderComposer(k); document.querySelector('.input.err')?.focus(); break; }
      const p = postById(k.split(':')[1]);
      p.replies.push({id:'r'+Date.now(), author:ME(), date:new Date(NOW), body:d.body.trim(), atts:d.atts.filter(x => !x.loading), reactions:{}, mine:[]});
      delete S.drafts[k]; toast('Response posted'); render(); break; }

    /* prototype */
    case 'proto': S.protoOpen = !S.protoOpen; renderProto(); break;
    case 'role': S.role = el.dataset.r; if (el.dataset.l) S.learnerId = el.dataset.l; S.menu = null; S.dialog = null; S.lastGbKey = null; checkGbLoad(); render(); break;
    case 'toggle-error': S.simError = !S.simError; render(); break;
    case 'reset-first': S.accepted = {coach:false, moderator:false, lc:false}; S.firstLanding = {coach:false, moderator:false, lc:false}; persist(); go('#/home'); toast('Reset. Open Support to see the guidelines.'); break;
    case 'bad-file': {
      let key = document.querySelector('.composer')?.dataset.key;
      if (!key){ S.protoOpen = false; go('#/support/community/new'); setTimeout(() => { draft('post').err.file = fileError('lesson-notes.pdf'); rerenderComposer('post'); }, 50); break; }
      draft(key).err.file = fileError('lesson-notes.pdf'); rerenderComposer(key); document.getElementById('composer-'+cssKey(key)).scrollIntoView({block:'center'}); break; }
    case 'gb-jump': {
      const to = el.dataset.to; S.lrn = 'ok'; S.courseFail = false;
      if (to.startsWith('gb:')){ if (S.role === 'learner') S.role = 'coach'; if (S.role === 'lc' && /michelle|dj/.test(to)) S.role = 'coach'; S.lastGbKey = null; go(to.slice(3)); }
      else if (to === 'gbprev'){ if (S.role === 'learner') S.role = 'coach'; S.lastGbKey = null; go('#/gradebook/michelle?year=' + encodeURIComponent(YEAR_PREV)); }
      else if (to.startsWith('kid:')){ const [, lid, h] = to.split(':'); S.role = 'learner'; S.learnerId = lid; S.learnerNoCourses = false; S.lastGbKey = null; go(h); }
      else if (to === 'redo'){ const c = courseById('k-ela'); const {l} = findLesson(c, c.units[0].lessons[0].id); if (lessonState(l) === 'complete'){ l.items.forEach(it => it.state = 'not'); S.reopened = [{cid:'k-ela', lid:l.id}, ...S.reopened.filter(r => r.lid !== l.id)]; } S.role = 'learner'; S.learnerId = 'michelle'; go('#/home'); }
      break; }
    case 'jump': {
      const to = el.dataset.to; S.simError = false;
      if (S.role === 'learner' && to !== 'learner') S.role = 'coach';
      if (to === 'gate'){ S.accepted[S.role] = false; persist(); go('#/support'); }
      else if (to === 'hub-first'){ S.accepted[S.role] = true; S.firstLanding[S.role] = true; persist(); S.loading = true; go('#/support'); render(); setTimeout(() => { S.loading = false; render(); }, 1400); }
      else if (to === 'hub'){ S.accepted[S.role] = true; S.firstLanding[S.role] = false; persist(); go('#/support'); }
      else if (to === 'learner'){ S.role = 'learner'; go('#/support'); }
      else if (to === 'error'){ S.simError = true; go('#/support'); }
      else if (to === 'mod'){ S.role = 'moderator'; S.accepted.moderator = true; persist(); S.menu = 'p:promo'; go('#/support/community/p/promo'); setTimeout(() => { S.menu = 'p:promo'; render(); }, 0); }
      else { if (!S.accepted[S.role]){ S.accepted[S.role] = true; persist(); } go(to); }
      break; }
  }
});
function fileError(name){
  return `\u201c${name}\u201d can\u2019t be attached. Add ${SUPPORTED} instead.`;
}
document.addEventListener('change', e => {
  const inp = e.target.closest('[data-file]'); if (!inp || !inp.files[0]) return;
  const key = inp.dataset.file, kind = inp.dataset.kind || 'video', f = inp.files[0];
  const d = draft(key); const ext = (f.name.split('.').pop()||'').toLowerCase();
  const found = Object.entries(TYPES).find(([t, v]) => v.ext.includes(ext));
  if (!found){ d.err.file = fileError(f.name); rerenderComposer(key); return; }
  const type = found[0];
  if (type === 'video') d.atts.push({type:'video', name:f.name, size:(f.size/1048576).toFixed(1)+' MB'});
  if (type === 'audio') d.atts.push({type:'audio', name:f.name, dur:'0:30'});
  if (type === 'gif') d.atts.push({type:'gif', g:4, e:'\ud83c\udf9e\ufe0f', label:f.name});
  d.err.file = null; d.panel = null; rerenderComposer(key);
});
document.addEventListener('change', e => {
  const sel = e.target.closest('[data-year-select]'); if (!sel) return;
  const lid = sel.dataset.yearSelect;
  go('#/gradebook/' + lid + (sel.value === YEAR_NOW ? '' : '?year=' + encodeURIComponent(sel.value)));
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.draft){ const d = draft(t.dataset.draft); d[t.dataset.field] = t.value; if (d.err[t.dataset.field] && t.value.trim()){ d.err[t.dataset.field] = null; t.classList.remove('err'); const m = t.parentElement.querySelector('.msg-err'); if (m) m.remove(); } }
  if (t.dataset.linkinput){ draft(t.dataset.linkinput).linkVal = t.value; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset.linkinput){ e.preventDefault(); document.querySelector(`[data-act="add-link"][data-k="${e.target.dataset.linkinput}"]`).click(); }
  if (e.key === 'Escape'){ if (S.dialog){ S.dialog = null; renderModal(); } else if (S.menu || S.rxMenu){ S.menu = null; S.rxMenu = null; render(); } }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form="search"]'); if (!f) return;
  e.preventDefault(); const q = new FormData(f).get('q').trim();
  go(q ? '#/support/articles?q=' + encodeURIComponent(q) : '#/support/articles');
});

checkGbLoad();
render();
</script>
</body>
</html>
