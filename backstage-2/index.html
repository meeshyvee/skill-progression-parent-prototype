<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backstage — StrongMind Homeschool</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Nunito+Sans:wght@400;600&family=Roboto+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
/* ============================================================
   LAYER 1 — PRIMITIVE TOKENS  (reference only)
   Source: fannypack-1-tokens.md §3
   ============================================================ */
:root{
  --neutral-0:#FFFFFF; --neutral-50:#FAFAFA; --neutral-100:#F5F5F5; --neutral-200:#E5E5E5;
  --neutral-300:#D4D4D4; --neutral-400:#A3A3A3; --neutral-500:#737373; --neutral-600:#525252;
  --neutral-700:#404040; --neutral-800:#262626; --neutral-900:#171717; --neutral-950:#0A0A0A;

  --lilac-bush-50:#F6F1FA; --lilac-bush-100:#E0CEED; --lilac-bush-200:#D0B4E4; --lilac-bush-300:#BF98DA;
  --lilac-bush-400:#B182D2; --lilac-bush-500:#A976CE; --lilac-bush-600:#8F5CB4; --lilac-bush-700:#7E4BA3;
  --lilac-bush-800:#4D1A72; --lilac-bush-900:#1D0042; --lilac-bush-950:#000021;

  --breaker-bay-50:#E9F8F8; --breaker-bay-100:#DAF4F4; --breaker-bay-200:#B1E7E6; --breaker-bay-300:#88DBDA;
  --breaker-bay-400:#5CCECC; --breaker-bay-500:#25BDBB; --breaker-bay-600:#0CA3A1; --breaker-bay-700:#009290;
  --breaker-bay-800:#00615F; --breaker-bay-900:#00312F; --breaker-bay-950:#00100E;

  --cinnabar-50:#FEF1EF; --cinnabar-100:#FEE8E4; --cinnabar-200:#FCCEC6; --cinnabar-300:#FAA393;
  --cinnabar-400:#F98B78; --cinnabar-500:#F87760; --cinnabar-600:#DE5D46; --cinnabar-700:#CD4C35;
  --cinnabar-800:#9C1B04; --cinnabar-900:#6C0000; --cinnabar-950:#390000;

  --cello-50:#E7F6F9; --cello-100:#D7F0F5; --cello-200:#AAE0E9; --cello-300:#60C5D6;
  --cello-500:#14A9C3; --cello-600:#008FA9; --cello-700:#007E98; --cello-800:#004D67;
  --cello-900:#001D37; --cello-950:#000016;

  --casablanca-50:#FFF7E5; --casablanca-100:#FFF2D4; --casablanca-200:#FFE3A3; --casablanca-300:#FFCA52;
  --casablanca-400:#FFBD26; --casablanca-500:#FFB100; --casablanca-600:#E59700; --casablanca-700:#A35500;
  --casablanca-800:#732500; --casablanca-900:#520400; --casablanca-950:#260000;

  --highland-50:#EFFBF6; --highland-100:#C7EFDF; --highland-200:#AAE7CE; --highland-300:#97E2C2;
  --highland-400:#7CDAB2; --highland-500:#65D4A5; --highland-600:#4BBA8B; --highland-700:#3AA97A;
  --highland-800:#097849; --highland-900:#004819; --highland-950:#002700;

  --pearl-brush-50:#F9F6F3; --pearl-brush-100:#F1EBE3; --pearl-brush-200:#E4D8CC; --pearl-brush-300:#CEB7A3;
  --pearl-brush-400:#BA977D; --pearl-brush-500:#AB7E64; --pearl-brush-600:#9E6D58; --pearl-brush-700:#84594A;
  --pearl-brush-950:#26170F;

  --lavender-pink-200:#FFDEE0; --lavender-pink-300:#FFC1C5; --lavender-pink-400:#FFB2B7;
  --lavender-pink-950:#260000;

/* ============================================================
   LAYER 2 — SEMANTIC TOKENS  (the only tokens components use)
   ============================================================ */
  --font-primary:'Poppins', sans-serif;
  --font-secondary:'Nunito Sans', sans-serif;
  --font-mono:'Roboto Mono', monospace;

  --link-color:var(--cello-600);

  --foreground-light:var(--neutral-400);
  --foreground-medium:var(--neutral-500);

  --background-light:var(--pearl-brush-50);
  --background-medium:var(--pearl-brush-100);
  --background-dark:var(--pearl-brush-200);

  --Status-error-light:var(--cinnabar-200);
  --Status-error-medium:var(--cinnabar-500);
  --Status-error-dark:var(--cinnabar-800);
  --Status-error-base:var(--cinnabar-600);
  --Status-warning-light:var(--casablanca-200);
  --Status-warning-dark:var(--cinnabar-800);
  --Status-success-light:var(--highland-200);
  --Status-success-dark:var(--highland-900);
  --Status-info-light:var(--cello-200);
  --Status-info-dark:var(--cello-800);
  --Status-announce-light:var(--lilac-bush-200);
  --Status-announce-dark:var(--lilac-bush-800);

  --Typography-text-base:var(--neutral-700);
  --Typography-text-muted:var(--neutral-400);

  --btn-primary-bg:var(--lilac-bush-600);
  --btn-primary-outline:var(--lilac-bush-600);
  --btn-primary-hover-bg:var(--lilac-bush-700);
  --btn-primary-hover-outline:var(--lilac-bush-700);
  --btn-primary-text:var(--neutral-0);

  --btn-secondary-bg:var(--breaker-bay-500);
  --btn-secondary-outline:var(--breaker-bay-500);
  --btn-secondary-hover-bg:var(--breaker-bay-600);
  --btn-secondary-hover-outline:var(--breaker-bay-600);
  --btn-secondary-text:var(--neutral-0);

  /* Spacing scale — Default_tokens.json > Padding and Gap */
  --space-xs:4px; --space-sm:8px; --space-md:12px; --space-lg:16px; --space-xl:24px; --space-2xl:40px;

  /* Explicit corner values — Figma --radius-* tokens are WIP (all 0), per §10 */
  --corner-sm:4px; --corner-md:6px; --corner-lg:8px; --corner-xl:12px; --corner-2xl:16px; --corner-pill:50px;
}

/* Font Awesome Pro weights (fa-light / fa-duotone) are not in the free CDN.
   Class names follow the design system; these rules let them render in the prototype. */
.fa-light,.fa-regular,.fa-duotone{font-family:"Font Awesome 6 Free" !important;font-weight:900 !important}

/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--background-light);
  color:var(--Typography-text-base);
  font-family:var(--font-secondary);
  font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,h5,h6{font-family:var(--font-primary);font-weight:600;margin:0;color:var(--neutral-800);line-height:1.25}
h1{font-size:32px}h2{font-size:24px}h3{font-size:19px}h4{font-size:16px}
p{margin:0}
a{color:var(--link-color)}
button{font-family:var(--font-secondary);font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--lilac-bush-600);outline-offset:2px;border-radius:var(--corner-sm)}
.mono{font-family:var(--font-mono);font-size:12px;color:var(--foreground-medium)}
.u-muted{color:var(--foreground-medium)}
.u-hidden{display:none}

/* ============================================================
   §6 BUTTONS — hs-button
   ============================================================ */
.hs-button{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--space-sm);
  font-family:var(--font-primary);font-weight:500;border-radius:var(--corner-lg);
  border:1px solid transparent;transition:background-color .15s ease,border-color .15s ease,color .15s ease;
}
.hs-button--large{font-size:16px;padding:14px var(--space-xl)}
.hs-button--medium{font-size:16px;padding:11px var(--space-lg)}
.hs-button--small{font-family:var(--font-secondary);font-size:13px;font-weight:400;line-height:19px;padding:var(--space-sm) var(--space-md)}
.hs-button--primary{background:var(--btn-primary-bg);border-color:var(--btn-primary-outline);color:var(--btn-primary-text)}
.hs-button--primary:hover{background:var(--btn-primary-hover-bg);border-color:var(--btn-primary-hover-outline)}
.hs-button--secondary{background:var(--btn-secondary-bg);border-color:var(--btn-secondary-outline);color:var(--btn-secondary-text)}
.hs-button--secondary:hover{background:var(--btn-secondary-hover-bg);border-color:var(--btn-secondary-hover-outline)}
.hs-button--outline{background:transparent;border-color:var(--neutral-700);color:var(--neutral-700)}
.hs-button--outline:hover{background:var(--background-medium)}
.hs-button--text{background:transparent;color:var(--neutral-700)}
.hs-button--text:hover{background:var(--background-medium)}
.hs-button--link{background:transparent;color:var(--link-color);padding-left:0;padding-right:0}
.hs-button--link:hover{text-decoration:underline;text-underline-offset:3px}
.hs-button--no-outline{background:transparent;color:var(--neutral-700)}
.hs-button--no-outline:hover{background:var(--background-medium)}
.hs-button--no-outline.hs-button--destructive{color:var(--Status-error-base)}
.hs-button--no-outline.hs-button--destructive:hover{background:var(--Status-error-light)}
.hs-button--icon-only{padding:var(--space-md);aspect-ratio:1;min-width:44px}
.hs-button--icon-only.hs-button--small{padding:var(--space-sm);min-width:34px}
.hs-button:disabled{color:var(--foreground-light);background:var(--neutral-100);border-color:var(--neutral-200);cursor:not-allowed}
.hs-button--on-dark.hs-button--outline{border-color:var(--pearl-brush-200);color:var(--pearl-brush-50)}
.hs-button--on-dark.hs-button--outline:hover{background:var(--lilac-bush-900)}
.hs-button-group{display:flex;gap:var(--space-md);align-items:center}
.justify-end{justify-content:flex-end}
.justify-start{justify-content:flex-start}
.flex-wrap{flex-wrap:wrap}

/* ============================================================
   §13 LABELS — hs-label
   ============================================================ */
.hs-label{
  display:inline-flex;align-items:center;gap:var(--space-xs);
  padding:var(--space-xs) var(--space-sm);border-radius:var(--corner-md);
  font-family:var(--font-primary);font-size:11.38px;font-weight:600;line-height:16.38px;white-space:nowrap;
}
.hs-label__icon i{font-size:11px}
.hs-label--neutral{background:var(--pearl-brush-200);color:var(--pearl-brush-950)}
.hs-label--red{background:var(--cinnabar-200);color:var(--cinnabar-950)}
.hs-label--yellow{background:var(--casablanca-200);color:var(--casablanca-950)}
.hs-label--green{background:var(--highland-200);color:var(--highland-950)}
.hs-label--teal{background:var(--breaker-bay-200);color:var(--breaker-bay-950)}
.hs-label--blue{background:var(--cello-200);color:var(--cello-950)}
.hs-label--purple{background:var(--lilac-bush-200);color:var(--lilac-bush-950)}
.hs-label--pink{background:var(--lavender-pink-200);color:var(--lavender-pink-950)}
.hs-label--clickable{cursor:pointer}
.hs-label--clickable.hs-label--yellow:hover{background:var(--casablanca-300)}
.hs-label--clickable.hs-label--purple:hover{background:var(--lilac-bush-300)}

/* ============================================================
   §16 ALERTS — hs-alert
   ============================================================ */
.hs-alert{
  display:flex;gap:var(--space-md);align-items:flex-start;
  padding:var(--space-lg);border-radius:var(--corner-xl);font-size:14px;
}
.hs-alert__icon i{font-size:15px}
.hs-alert--success{background:var(--Status-success-light);color:var(--Status-success-dark)}
.hs-alert--warning{background:var(--Status-warning-light);color:var(--Status-warning-dark)}
.hs-alert--error{background:var(--Status-error-light);color:var(--Status-error-dark)}
.hs-alert--info{background:var(--Status-info-light);color:var(--Status-info-dark)}
.hs-alert--announce{background:var(--Status-announce-light);color:var(--Status-announce-dark)}

/* ============================================================
   §18 TOOLTIP — hs-tooltip
   ============================================================ */
.hs-tooltip-wrapper{position:relative;display:inline-flex}
.hs-tooltip{
  padding:var(--space-md) var(--space-lg);border-radius:var(--corner-lg);
  display:inline-flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;gap:15px;
  position:absolute;top:calc(100% + var(--space-sm));right:0;z-index:20;
  opacity:0;pointer-events:none;transition:opacity .15s ease;white-space:nowrap;
}
.hs-tooltip--dark{background:var(--neutral-800)}
.hs-tooltip--dark .hs-tooltip__text{color:var(--pearl-brush-50)}
.hs-tooltip--light{background:var(--pearl-brush-100)}
.hs-tooltip--light .hs-tooltip__text{color:var(--neutral-700)}
.hs-tooltip__text{font-family:var(--font-primary);font-size:10.5px;font-weight:600;line-height:15.5px;letter-spacing:.1px;align-self:stretch}
.hs-tooltip-wrapper:hover .hs-tooltip,.hs-tooltip-wrapper:focus-within .hs-tooltip{opacity:1}

/* ============================================================
   §19 TAGS — hs-tag
   ============================================================ */
.hs-tag-group{display:inline-flex;flex-wrap:wrap;align-content:flex-start;gap:var(--space-sm)}
.hs-tag{display:flex;justify-content:flex-start;align-items:center;gap:var(--space-lg);padding:var(--space-sm) var(--space-lg);border-radius:var(--corner-pill);cursor:default}
.hs-tag__label{color:var(--neutral-700);font-family:var(--font-primary);font-size:11.38px;font-weight:600;line-height:16.38px}
.hs-tag__dismiss{color:var(--neutral-700);font-size:11px;font-weight:400;line-height:14px;text-align:right;cursor:pointer}
.hs-tag--lilac-bush{background:var(--lilac-bush-300)}
.hs-tag--lilac-bush:hover{background:var(--lilac-bush-400)}
.hs-tag--breaker-bay{background:var(--breaker-bay-300)}
.hs-tag--breaker-bay:hover{background:var(--breaker-bay-400)}
.hs-tag--casablanca{background:var(--casablanca-300)}
.hs-tag--casablanca:hover{background:var(--casablanca-400)}
.hs-tag--pearl-brush{background:var(--pearl-brush-300)}
.hs-tag--pearl-brush:hover{background:var(--pearl-brush-400)}
.hs-tag--neutral{background:var(--neutral-300)}
.hs-tag--neutral:hover{background:var(--neutral-400)}

/* ============================================================
   §20 CHECKBOX — hs-checkbox
   ============================================================ */
.hs-checkbox-input{display:none}
.hs-checkbox-wrapper{display:inline-flex;align-items:center;gap:var(--space-sm);padding:6px;border-radius:var(--corner-lg);cursor:pointer;width:fit-content}
.hs-checkbox-wrapper:has(.hs-checkbox-input:not(:checked)):hover{background:var(--pearl-brush-100)}
.hs-checkbox-wrapper:has(.hs-checkbox-input:checked):hover{background:var(--highland-100)}
.hs-checkbox{width:24px;height:24px;padding:var(--space-sm);border-radius:var(--corner-sm);border:.8px solid var(--neutral-700);display:inline-flex;justify-content:center;align-items:center;flex-shrink:0}
.hs-checkbox-input:checked ~ .hs-checkbox{background:var(--highland-600);border-color:var(--highland-600)}
.hs-checkbox__icon{font-size:10px;font-weight:900;line-height:14px;color:var(--neutral-0)}
.hs-checkbox__label{font-family:var(--font-secondary);font-size:13px;font-weight:400;color:var(--neutral-700)}

/* ============================================================
   §21 MODAL — hs-modal
   ============================================================ */
.hs-modal-scrim{position:fixed;inset:0;background:rgba(38,38,38,.55);display:grid;place-items:center;padding:var(--space-xl);z-index:60}
.hs-modal{width:100%;max-width:620px;padding:var(--space-xl);background:var(--neutral-0);display:flex;flex-direction:column;gap:var(--space-lg);max-height:86vh;overflow:auto}
.hs-modal--desktop{border-radius:var(--corner-2xl);box-shadow:0 4px 4px rgba(0,0,0,.25)}
.modal-header{display:flex;align-items:flex-start;gap:var(--space-lg);justify-content:space-between}
.modal-content{display:flex;flex-direction:column;gap:var(--space-lg)}
.modal-footer{display:flex;padding-top:var(--space-sm)}

/* ============================================================
   LAYOUT — flex/grid only, no absolute positioning for layout
   ============================================================ */
.app-shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh;background:var(--background-light)}

.sidebar{display:flex;flex-direction:column;gap:var(--space-xl);padding:var(--space-xl) var(--space-lg);background:var(--neutral-0);border-right:1px solid var(--neutral-200)}
.brand{display:flex;align-items:center;gap:var(--space-sm);font-family:var(--font-primary);font-weight:600;font-size:19px;color:var(--neutral-800)}
.brand__mark{display:grid;place-items:center;width:30px;height:30px;border-radius:var(--corner-lg);background:var(--casablanca-300);color:var(--casablanca-800);font-size:14px}
.profile-block{display:flex;flex-direction:column;align-items:center;gap:var(--space-sm);padding:var(--space-sm);text-align:center}
.avatar{display:grid;place-items:center;border-radius:var(--corner-pill);color:var(--neutral-0);font-family:var(--font-primary);font-weight:600;flex-shrink:0}
.avatar--xl{width:64px;height:64px;font-size:24px}
.avatar--md{width:40px;height:40px;font-size:15px}
.avatar--sm{width:28px;height:28px;font-size:12px}
.avatar--lilac{background:var(--lilac-bush-600)}
.avatar--teal{background:var(--breaker-bay-600)}
.avatar--cinnabar{background:var(--cinnabar-600)}
.avatar--cello{background:var(--cello-700)}
.avatar--casablanca{background:var(--casablanca-700)}
.avatar--neutral{background:var(--neutral-700)}
.nav-list{display:flex;flex-direction:column;gap:var(--space-xs)}
.nav-item{display:flex;align-items:center;gap:var(--space-md);padding:var(--space-md) var(--space-lg);border-radius:var(--corner-xl);text-align:left;width:100%;font-size:15px;color:var(--neutral-700)}
.nav-item:hover{background:var(--background-medium)}
.nav-item[aria-current="page"]{background:var(--lilac-bush-50);color:var(--lilac-bush-800);font-weight:600}
.nav-item i{width:18px;text-align:center;color:var(--lilac-bush-600)}
.nav-item__count{display:grid;place-items:center;min-width:22px;height:22px;padding:0 6px;margin-left:auto;
  border-radius:var(--corner-pill);background:var(--cinnabar-600);color:var(--neutral-0);
  font-family:var(--font-primary);font-size:11.5px;font-weight:600}
.nav-group{display:flex;flex-direction:column;gap:var(--space-sm)}
.nav-group__title{font-family:var(--font-primary);font-size:12px;font-weight:600;color:var(--foreground-medium);letter-spacing:.06em;padding-left:var(--space-lg)}
.learner-row{display:flex;align-items:center;gap:var(--space-md);padding:var(--space-sm) var(--space-lg);border-radius:var(--corner-xl);width:100%;text-align:left;font-size:14px}
.learner-row:hover{background:var(--background-medium)}

.sidebar__footer{display:flex;flex-direction:column;gap:var(--space-md);padding-top:var(--space-lg)}
.nudge-card{display:flex;flex-direction:column;gap:var(--space-sm);padding:var(--space-lg);border-radius:var(--corner-xl);background:var(--casablanca-100);border:1px solid var(--casablanca-200)}
.nudge-card h4{font-size:15px;color:var(--casablanca-800)}
.nudge-card p{font-size:13px;color:var(--neutral-700)}

.main-column{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:var(--space-lg);padding:var(--space-md) var(--space-xl);background:var(--neutral-0);border-bottom:1px solid var(--neutral-200)}
.breadcrumb{display:flex;align-items:center;gap:var(--space-sm);font-size:15px;color:var(--foreground-medium);min-width:0}
.topbar__actions{display:flex;align-items:center;gap:var(--space-sm);margin-left:auto}
.icon-frame{border:1px solid var(--neutral-200);border-radius:var(--corner-xl);color:var(--neutral-700)}
.page{display:flex;flex-direction:column;gap:var(--space-xl);padding:var(--space-xl);width:100%;max-width:1120px;margin-inline:auto}

/* ---------- dashboard ---------- */
.greeting{display:flex;flex-direction:column;align-items:center;gap:var(--space-lg);padding:var(--space-2xl) var(--space-xl);border-radius:var(--corner-2xl);text-align:center;
  background:var(--background-medium);
  background-image:radial-gradient(420px 180px at 8% 0%,var(--lavender-pink-200),transparent 70%),radial-gradient(420px 200px at 95% 110%,var(--casablanca-200),transparent 70%);
}
.greeting p{max-width:60ch;color:var(--neutral-700)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--space-lg);width:100%;max-width:620px}
.stat-card{display:flex;align-items:center;gap:var(--space-lg);padding:var(--space-lg);border-radius:var(--corner-xl);background:var(--neutral-0);border:1px solid var(--neutral-200);text-align:left}
.stat-card__icon{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--corner-lg);background:var(--background-medium);color:var(--lilac-bush-700);flex-shrink:0}
.stat-card__body{display:flex;flex-direction:column}
.stat-card__value{font-family:var(--font-primary);font-size:22px;font-weight:600;color:var(--neutral-800);line-height:1.2}
.stat-card__label{font-size:13px;color:var(--foreground-medium)}

.segmented{display:flex;gap:var(--space-xs);padding:var(--space-xs);border-radius:var(--corner-pill);background:var(--neutral-0);border:1px solid var(--neutral-200);width:fit-content;margin-inline:auto}
.segmented button{padding:var(--space-sm) var(--space-xl);border-radius:var(--corner-pill);font-family:var(--font-primary);font-weight:500;color:var(--foreground-medium)}
.segmented button[aria-pressed="true"]{background:var(--lilac-bush-600);color:var(--neutral-0)}

.surface{display:flex;flex-direction:column;background:var(--neutral-0);border:1px solid var(--neutral-200);border-radius:var(--corner-2xl);overflow:hidden}
.surface__header{display:flex;align-items:center;gap:var(--space-lg);padding:var(--space-lg) var(--space-xl);border-bottom:1px solid var(--neutral-200)}
.surface__header .hs-button{margin-left:auto}

.lesson{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--space-xl);padding:var(--space-xl);border-bottom:1px solid var(--neutral-200)}
.lesson:last-child{border-bottom:none}

/* ============================================================

let posts = [
  {id:'p1',channel:'roadmap',pinned:true,pinnedAt:3,author:'Erin Dow',isStaff:true,title:'StrongMind — Product Manager',

   attachments:[],reactions:{'🎉':14,'💜':9},mine:[],replies:[]},

       {id:'r1a',author:'Erin Dow',isStaff:true,title:'StrongMind — Product Manager',time:'1 day ago',text:'Happy to hear it. Does she have a tablet or a laptop there? Download sizes differ and I would rather size this against real houses than guesses.',children:[]}

/* ============================================================
   HELPERS
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const me = () => ROLES[state.role];
const canEnter = () => me().fm || me().staff;
const isModerator = () => me().staff;
const openPolls = () => polls.filter(p=>p.status==='open').length;
const needsMyVote = () => polls.filter(p=>p.status==='open' && !p.myVote).length;

function hook(stage,text){
  if(!state.hooks) return '';
  return `<p class="hook-note"><i class="fa-light fa-diagram-project" aria-hidden="true"></i>${esc(stage)} — ${esc(text)}</p>`;
}
function toast(message,icon){
  $('#toast-root').innerHTML = `<div class="toast"><i class="fa-solid ${icon||'fa-circle-check'}" aria-hidden="true"></i>${esc(message)}</div>`;
  clearTimeout(window._toast);
  window._toast = setTimeout(()=>{$('#toast-root').innerHTML='';},2800);
}

/* ============================================================
   NAVIGATION + GATING
   ============================================================ */
function setRole(role){ Object.assign(state,{role,view:'dashboard',openThread:null,showGate:false}); render(); }
function goDashboard(){ Object.assign(state,{view:'dashboard',openThread:null}); render(); }
function setTab(tab){ Object.assign(state,{tab,openThread:null,composerError:null,attachments:[]}); render(); }
function resetGuidelines(){ state.accepted={}; toast('Guidelines gate reset for every role','fa-rotate-left'); render(); }
function toggleHooks(){ state.hooks=!state.hooks; render(); }
function toggleError(){
  state.errorMode=!state.errorMode;
  if(state.view==='backstage' && state.errorMode) state.view='error';
  render();
}

function openBackstage(){
  if(state.errorMode){ state.view='error'; render(); return; }        /* R-14 / NFR-04 */
  state.view='checking'; render();                                     /* R-03 / NFR-03 */
  setTimeout(()=>{
    if(!canEnter()){ state.view='denied'; render(); return; }          /* R-01 / R-03 */
    if(!state.accepted[state.role]) state.showGate = true;             /* R-06 */
    state.view='backstage'; render();
  },700);
}
function directURL(){ toast('Going straight to /backstage — the check runs either way','fa-link'); openBackstage(); }
function acceptGuidelines(){ state.accepted[state.role]=true; state.showGate=false; render(); toast('You are all set. Welcome in.','fa-hand'); }
function declineGuidelines(){ state.showGate=false; state.view='dashboard'; render(); toast('No problem — your plan is right where you left it','fa-house'); }

/* ============================================================
   INTERACTIONS
   ============================================================ */
function findItem(id){ return posts.concat(prompts, polls).find(i=>i.id===id); }

function toggleReaction(id,emoji){
  const item=findItem(id); if(!item) return;
  item.reactions=item.reactions||{}; item.mine=item.mine||[];
  const at=item.mine.indexOf(emoji);
  if(at>-1){ item.mine.splice(at,1); item.reactions[emoji]=(item.reactions[emoji]||1)-1; if(item.reactions[emoji]<1) delete item.reactions[emoji]; }
  else { item.mine.push(emoji); item.reactions[emoji]=(item.reactions[emoji]||0)+1; }
  render();
}

let pinCounter=6;
function togglePin(id){
  const item=findItem(id); if(!item) return;
  item.pinned=!item.pinned;
  if(item.pinned){ item.pinnedAt=pinCounter++; toast('Pinned to the top of this feed','fa-thumbtack'); }
  else toast('Unpinned — back in date order','fa-thumbtack');
  render();
}
function removeItem(id){
  posts=posts.filter(i=>i.id!==id); prompts=prompts.filter(i=>i.id!==id); polls=polls.filter(i=>i.id!==id);
  state.openThread=null; toast('Removed. Author notified and the item is in the moderation log.','fa-trash-can'); render();
}
function removeMember(name){ toast(name+' no longer has access to Backstage','fa-user-slash'); }
function escalate(){ toast('Sent to the moderation queue for a second look','fa-flag'); }

function vote(pollId,optionId){
  const poll=polls.find(p=>p.id===pollId);
  if(!poll || poll.myVote || poll.status==='closed') return;
  poll.myVote=optionId;
  poll.options.find(o=>o.id===optionId).votes++;
  toast('Vote counted. Thanks for weighing in.','fa-check-double');
  render();
}

/* Saving a post — members can keep anything to come back to later */
function isSaved(id){ return state.saved.includes(id); }
function toggleSave(id){
  const item=findItem(id); if(!item) return;
  const at=state.saved.indexOf(id);
  if(at>-1){ state.saved.splice(at,1); toast('Removed from your saved posts','fa-bookmark'); }
  else { state.saved.unshift(id); toast('Saved. Find it any time under Saved.','fa-bookmark'); }
  render();
}
function savedItems(){
  return state.saved.map(findItem).filter(Boolean);
}

function openThread(id){ state.openThread = state.openThread===id ? null : id; state.composerError=null; state.attachments=[]; render(); }
function toggleAttachment(kind){
  if(kind==='.exe'){ state.composerError='We cannot take .exe files here. A video, audio clip, link, or GIF works.'; render(); return; }
  const at=state.attachments.indexOf(kind);
  if(at>-1) state.attachments.splice(at,1); else state.attachments.push(kind);
  state.composerError=null; render();
}
function submitReply(postId){
  const field=document.getElementById('reply-'+postId);
  const text=(field ? field.value : '').trim();
  if(!text){ state.composerError='Add a few words so people know what you mean — attachments go alongside your text, not instead of it.'; render(); return; }
  const item=findItem(postId);
  const attached=state.attachments.slice();
  item.replies.push({id:'new'+Date.now(),author:me().name,isStaff:me().staff,title:me().staff?me().sub:null,
                     time:'Just now',text,attached,children:[]});
  state.attachments=[]; state.composerError=null;
  toast('Posted. The team reads every one of these.','fa-paper-plane');
  render();
}

function pollCard(poll){
  const total=poll.options.reduce((n,o)=>n+o.votes,0);
  const closed=poll.status==='closed';
  const showResults=closed || !!poll.myVote;          /* R-09 */
  return `<article class="card ${poll.pinned?'card--pinned':''}">
    ${poll.pinned?`<p class="card__pinbar"><i class="fa-solid fa-thumbtack" aria-hidden="true"></i>Pinned poll</p>`:''}

        <span class="byline__name">${esc(poll.author)} ${personBadge(poll.isStaff,poll.title)}</span>
        <span class="byline__time">${esc(poll.time)}${poll.closes?' · '+esc(poll.closes):''}</span>
      </div>
      <span class="hs-label ${closed?'hs-label--neutral':'hs-label--green'}"><span class="hs-label__text">${closed?'Closed':'Open for votes'}</span></span>
    </div>
    <h3>${esc(poll.heading)}</h3>
    <p class="card__body">${esc(poll.body)}</p>
    ${poll.shaped?`<p class="shaped"><i class="fa-solid fa-seedling" aria-hidden="true"></i>Your answers changed how the planner opens.</p>`:''}
    <div class="poll-options">
      ${poll.options.map(o=>{
        const pct = total ? Math.round(o.votes/total*100) : 0;
        const mine = poll.myVote===o.id;
        if(showResults){
          return `<div class="poll-option ${mine?'poll-option--mine':''}" style="--fill:${pct}%">
            <span class="poll-option__fill"></span>
            <span class="poll-option__label">${mine?'<i class="fa-solid fa-check" aria-hidden="true"></i> ':''}${esc(o.text)}</span>
            <span class="poll-option__pct">${pct}%</span></div>`;
        }
        return `<button type="button" class="poll-option" onclick="vote('${poll.id}','${o.id}')">
          <i class="fa-light fa-circle" aria-hidden="true"></i><span class="poll-option__label">${esc(o.text)}</span></button>`;
      }).join('')}
    </div>
    <p class="u-muted">${closed
      ? `Final results from ${total} families. Closed polls stay here so you can see what happened.`
      : showResults
        ? `${total} families have voted. Your answer is saved — one vote each keeps this honest.`
        : `Results appear the moment you vote, or when the poll closes on Sept 30.`}</p>
    ${!showResults?hook('Variable reward','Results are hidden until you act, so voting reveals something new every time.'):''}
    <div class="card__footer">
      ${reactionRow(poll)}
      ${saveButton(poll)}
      ${moderatorTools(poll)}
    </div>
  </article>`;
}

        <section class="bs-hero">
          <div class="bs-hero__lead">
            <div class="bs-hero__title">
              <div class="bs-hero__eyebrow">
                <span class="hs-label hs-label--yellow"><span class="hs-label__icon"><i class="fa-solid fa-star" aria-hidden="true"></i></span><span class="hs-label__text">Founding Member · Backstage</span></span>
              </div>
              <h1>Backstage</h1>
            </div>
            <p>Good to see you, ${esc(u.first)}. This is where we build alongside the first families on the platform — what just shipped, what is coming next, and the questions we still need your help answering.</p>
            <p class="bs-hero__note">
              <span class="bs-hero__dot" aria-hidden="true"></span>
              <span><b>86 founding families</b> are building alongside you</span>
            </p>
          </div>

          <aside class="member-badge">
            <div class="medallion ${u.staff?'medallion--staff':''}">
              <div class="medallion__ring">
                <div class="medallion__face">
                  <i class="fa-solid ${u.staff?'fa-shield-halved':'fa-star'} medallion__star" aria-hidden="true"></i>
                  <span class="medallion__label">${u.staff?'STRONGMIND<br>TEAM':'FOUNDING<br>MEMBER'}</span>
                </div>
              </div>
              <span class="medallion__ribbon">${u.staff?'MODERATOR · PLATFORM-WIDE':'MEMBER SINCE SEPT 2026'}</span>
            </div>

          </aside>
        </section>

        <div class="tabs" role="tablist">
          <button type="button" role="tab" aria-selected="${state.tab==='roadmap'}" onclick="setTab('roadmap')">
            <i class="fa-duotone fa-solid fa-map" aria-hidden="true"></i>What we are building</button>
          <button type="button" role="tab" aria-selected="${state.tab==='polls'}" onclick="setTab('polls')">
            <i class="fa-duotone fa-solid fa-chart-simple" aria-hidden="true"></i>Polls
            <span class="hs-label hs-label--green"><span class="hs-label__text">${openPolls()} open</span></span></button>
          <button type="button" role="tab" aria-selected="${state.tab==='feedback'}" onclick="setTab('feedback')">
            <i class="fa-duotone fa-solid fa-comments" aria-hidden="true"></i>We are asking you
            <span class="hs-label hs-label--neutral"><span class="hs-label__text">${prompts.length}</span></span></button>
          <button type="button" role="tab" aria-selected="${state.tab==='saved'}" onclick="setTab('saved')">
            <i class="fa-duotone fa-solid fa-bookmark" aria-hidden="true"></i>Saved
            ${state.saved.length?`<span class="hs-label hs-label--teal"><span class="hs-label__text">${state.saved.length}</span></span>`:''}</button>
        </div>

        ${body}
      </main>
    </div>
  </div>`;
}

function guidelinesModal(){
  return `<div class="hs-modal-scrim">
    <div class="hs-modal hs-modal--desktop" role="dialog" aria-modal="true" aria-labelledby="guidelines-title">
      <header class="modal-header">
        <h2 id="guidelines-title">A few house rules before you come in</h2>
        <button type="button" class="hs-button hs-button--no-outline hs-button--small hs-button--icon-only" aria-label="Close" onclick="declineGuidelines()">
          <i class="fa-light fa-close" aria-hidden="true"></i></button>
      </header>
      <div class="modal-content">
        <p class="u-muted">Read these once. They apply to everyone here, families and StrongMind staff alike.</p>
        <div class="hs-alert hs-alert--announce"><span class="hs-alert__icon"><i class="fa-regular fa-comments" aria-hidden="true"></i></span>
          <p><strong>Say the real thing.</strong> Honest feedback is exactly why you are here. Be hard on the product, easy on each other.</p></div>
        <div class="hs-alert hs-alert--info"><span class="hs-alert__icon"><i class="fa-regular fa-lock" aria-hidden="true"></i></span>
          <p><strong>What is here stays here.</strong> Roadmap posts cover things we have not released yet, so please keep screenshots out of public places.</p></div>
        <div class="hs-alert hs-alert--warning"><span class="hs-alert__icon"><i class="fa-regular fa-user-shield" aria-hidden="true"></i></span>
          <p><strong>Grown-ups only.</strong> Backstage is for admin parents. Please do not share your login or post on a learner's behalf.</p></div>
        <div class="hs-alert hs-alert--success"><span class="hs-alert__icon"><i class="fa-regular fa-shield-halved" aria-hidden="true"></i></span>
          <p><strong>We keep an eye on it.</strong> StrongMind moderators review flagged posts so this stays a place you feel safe writing in.</p></div>
      </div>
      <div class="modal-footer">
        <div class="hs-button-group justify-end flex-wrap">
          <button type="button" class="hs-button hs-button--outline hs-button--medium" onclick="declineGuidelines()">Maybe later</button>
          <button type="button" class="hs-button hs-button--primary hs-button--medium" onclick="acceptGuidelines()">
            <i class="fa-solid fa-check" aria-hidden="true"></i>I agree, take me in</button>
        </div>
      </div>
    </div>
  </div>`;
}

function checkingScreen(){
  return `<div class="app-shell">${sidebar('backstage')}<div class="main-column">${topbar('Backstage')}
    <main class="page"><div class="checking">
      <span class="spinner" aria-hidden="true"></span>
      <p>Just a moment — making sure this is your space.</p>
      <p class="mono">R-03 / NFR-03 — Founding Member status is checked right now, never read from an earlier session.</p>
    </div></main></div></div>`;
}

function deniedScreen(){
  const learner = state.role==='learner';
  return `<div class="app-shell">${sidebar('plan')}<div class="main-column">${topbar('Backstage')}
    <main class="page"><div class="state-panel">
      <span class="state-panel__icon"><i class="fa-solid ${learner?'fa-user-shield':'fa-ticket'}" aria-hidden="true"></i></span>
      <h2>${learner?'This part is for grown-ups':'Backstage is for Founding Members'}</h2>
      <p>${learner
        ? 'Learner profiles cannot open Backstage. Head back to your plan — you have two lessons waiting, and the first one is short.'
        : 'Backstage is open to admin parents who joined during the founding window. Everything else on your plan works exactly the same.'}</p>
      <button type="button" class="hs-button hs-button--primary hs-button--medium" onclick="goDashboard()">
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>Back to ${learner?'my lessons':'my dashboard'}</button>
      <p class="mono">${learner
        ? 'R-01 / NFR-02 — denied at the platform authorization layer; the Community Platform is never loaded.'
        : 'R-03 — Founding Member check did not pass, so no Backstage content was requested.'}</p>
    </div></main></div></div>`;
}

function errorScreen(){
  return `<div class="app-shell">${sidebar('plan')}<div class="main-column">${topbar('Backstage')}
    <main class="page"><div class="state-panel">
      <span class="state-panel__icon"><i class="fa-solid fa-screwdriver-wrench" aria-hidden="true"></i></span>
      <h2>Something went wrong. Try again later.</h2>
      <p>Backstage did not load this time. Nothing you posted is lost, and your lessons and planner are working normally.</p>
      <div class="hs-button-group flex-wrap">
        <button type="button" class="hs-button hs-button--outline hs-button--medium" onclick="openBackstage()">
          <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>Try again</button>
        <button type="button" class="hs-button hs-button--primary hs-button--medium" onclick="goDashboard()">
          <i class="fa-solid fa-house" aria-hidden="true"></i>Back to my dashboard</button>
      </div>
      <p class="mono">R-14 / NFR-04 — a plain fallback instead of a 500 or a blank screen.</p>
    </div></main></div></div>`;
}

/* ============================================================
   MOUNT
   ============================================================ */
function render(){
  const screens={dashboard,checking:checkingScreen,denied:deniedScreen,error:errorScreen,backstage};
  $('#app').innerHTML = (screens[state.view]||dashboard)();
  $('#modal-root').innerHTML = state.showGate ? guidelinesModal() : '';
}
/* Roles and states are reachable from the address bar so the screen stays clean:
   ?role=founding | staff | parent | coach | learner   ·   &hooks=1   ·   &outage=1 */
(function readURL(){
  const q=new URLSearchParams(location.search);
  const role=q.get('role');
  if(role && ROLES[role]) state.role=role;
  if(q.get('hooks')==='1') state.hooks=true;
  if(q.get('outage')==='1') state.errorMode=true;
})();
render();
</script>
</body>
</html>
